<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ความร้อนทั้งบท · ก่อน/หลังเรียน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Sarabun:wght@400;600&display=swap">
<style>
/* Built by tools/build-sheet-class.mjs from tools/sheet-class-shell.html — edit those, not the built page.
   A worksheet as a live class. One page, three screens:
   student (default): the student sheet page by page, write with the pencil, "Send to teacher";
   #show: the teacher's screen to share on the call — same pages, no answers, the teacher writes, can bring up the student's sent work;
   #teacher (retired, opens #show): was hidden — what the student sent, the answer key under it, red pen for marking (not shown to the student), save as PDF;
   #live: the teacher's hidden screen — every student's page and ink as she writes (Firebase, CFG.fb), tap one to see it big with the key. */
:root{
  --bg:#f8f3ea; --card:#fff; --fg:#1f2836; --muted:#5d6676; --line:#ddd4c6;
  --navy:#2b3a55; --peach:#db9e89; --sage:#729783; --mint:#e9f2eb; --good:#2f7a4f; --bad:#b03a2e; --red:#d62828; --blue:#1f5fa8;
  --display:"Poppins","Sarabun",system-ui,sans-serif; --body:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
button,select{font:600 15px var(--display);color:var(--fg);cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg);z-index:50}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
#gate h1{font:700 1.5rem var(--display);margin:0}
#gate label{font:600 15px var(--display);display:flex;flex-direction:column;gap:6px}
#gate input{font:600 20px var(--display);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);-webkit-user-select:text;user-select:text}
#gate .err{color:var(--bad);min-height:1.4em;font-weight:600}
.big{font:700 1.15rem var(--display);min-height:56px;padding:0 24px;border-radius:14px;border:none;background:var(--navy);color:#fff}
.big:disabled{opacity:.45}

/* ---------- app ---------- */
#app{height:100dvh;display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:8px}
#bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#bar h1{font:700 1.05rem var(--display);margin:0 4px 0 0;white-space:nowrap}
#who{color:var(--muted);font-weight:600}
.sp{flex:1}
.b{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.b[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sw{width:22px;height:22px;border-radius:50%;display:inline-block;vertical-align:middle}
#send{background:var(--sage);color:#fff;border-color:var(--sage);min-width:150px}
#send.done{background:var(--mint);color:var(--good);border-color:var(--mint)}
#net{color:var(--bad);font-weight:600;font-size:14px}
#status{color:var(--good);font-weight:600;font-size:14px;min-width:4em}
#nav{display:flex;align-items:center;gap:5px}
#nav .arr{min-width:52px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
#dots{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:4px 2px}   /* one row, slides sideways on long sheets */
#dots::-webkit-scrollbar{display:none}
#dots button{flex:none}
#dots button{min-width:38px;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:600 13px var(--display);position:relative;padding:0 3px}
#dots button[aria-current="true"]{outline:3px solid var(--navy);outline-offset:-3px}
#dots button.sent{background:var(--mint)}
#dots button.new::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#e07a1f;border:2px solid #fff}
#stu{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 8px}
#note{font-size:14px;color:var(--muted);font-weight:600}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.b.i{display:inline-flex;align-items:center;justify-content:center;gap:6px}
#tPen .sw{width:12px;height:12px;margin-left:-2px}
#colors{display:inline-flex;gap:4px;align-items:center;padding:0 2px}
#colors button{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
#colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
#sizes{display:inline-flex;gap:2px;align-items:center;padding:0 2px}
#sizes button{width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:none;padding:0;display:grid;place-items:center}
#sizes button i{display:block;border-radius:50%;background:var(--fg)}
#sizes button[aria-pressed="true"]{border-color:var(--fg);background:var(--card)}
#nav .arr{display:inline-flex;align-items:center;justify-content:center}
#work,#fWork{flex:1;min-height:0;display:flex;gap:8px}
#work #scroll,#fWork #fScroll{flex:1;min-width:0}
/* answer boxes: one card per question on this page */
#ans{width:min(330px,34vw);overflow:auto;display:flex;flex-direction:column;gap:8px;-webkit-user-select:text;user-select:text}
#ans .sym{display:flex;gap:4px;flex-wrap:wrap}
#ans .sym button{min-width:40px;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:600 17px var(--body)}
.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px}
.qa h3{font:700 15px var(--display);margin:0}
.qa .pt{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted);font-weight:600}
.qa .row{display:flex;gap:5px}
.qa input,.qa select{font:600 17px var(--body);min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 8px;min-width:0;color:var(--fg)}
.qa input.num{flex:1.6}.qa input.unit{flex:1}
.qa select{width:100%}
.qa .go{min-height:44px;border-radius:10px;border:none;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.qa .go:disabled{background:var(--line);color:var(--muted)}
.qa .st{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:flex-start;gap:6px}
.qa .st .ic{width:18px;height:18px}
.qa.ok{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}.qa.ok .st{color:var(--good)}
.qa.no{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}.qa.no .st{color:var(--bad)}
.qa .hb{display:flex;gap:6px;flex-wrap:wrap}
.qa .hb button,.rq .hv{min-height:42px;border-radius:10px;border:1.5px solid var(--blue);background:#eef4fc;color:var(--blue);font:700 15px var(--display);padding:0 14px;display:inline-flex;align-items:center;gap:6px}
#hintBox{position:fixed;inset:0;z-index:40;background:rgba(20,24,32,.6);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 10px 10px}
#hintBox .hbIn{background:#fff;border-radius:16px;width:min(100%,1180px);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#hintBox .hbTop{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
#hintBox .hbTop b{font:700 17px var(--display);margin-right:auto}
#hintBox .hbTop button{min-height:40px;min-width:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:700 15px var(--display);padding:0 12px}
#hintBox .hbTop button[aria-current="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
#hbBody{overflow:auto;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#hbBody svg{display:block;width:100%;height:auto;max-height:calc(100dvh - 90px);background-color:#fffdf8;background-image:linear-gradient(#eef1f6 1px,transparent 1px),linear-gradient(90deg,#eef1f6 1px,transparent 1px);background-size:2.5% 4.1667%;transform:translateZ(0)}
/* while a hint or animation is open the sheet underneath is not painted (iPad Safari lagged repainting both) */
body.hbOpen #work,body.hbOpen #fWork{visibility:hidden}
#hbBody [data-go],#hbBody [data-tog]{cursor:pointer}
#toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:var(--blue);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;
  display:flex;align-items:center;gap:10px;font:600 16px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
#toast button{min-height:40px;border-radius:10px;border:none;background:#fff;color:var(--blue);padding:0 14px}
#zoomSol{position:fixed;inset:0;z-index:40;background:rgba(20,24,32,.75);display:grid;place-items:center;padding:16px}
#zoomSol img{max-width:min(100%,1000px);max-height:100%;background:#fff;border-radius:10px}
.rq .pub{min-height:38px;border-radius:10px;border:1px dashed var(--blue);background:var(--card);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.rq .pub.on{background:var(--blue);color:#fff;border-style:solid}
.rq .hl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.rq .hl .pub{padding:0 12px}
.qa .hint{color:var(--fg);font-weight:600;background:var(--bg);border-radius:8px;padding:6px 8px;white-space:pre-wrap}
/* game classes (CFG.game): ก ข ค ง buttons, a bet of 1–3 coins on the drill, the coin counter */
.qa .ch4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qa .ch4 button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:700 22px var(--display);color:var(--fg)}
.qa .ch4 button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.qa .ch4 button:disabled{opacity:.75}
.qa .bets{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:600;color:var(--muted)}
.qa .bets button{flex:1;min-height:44px;border-radius:22px;border:2px solid #e9b949;background:#fff8e1;color:#8a5a00;font:700 17px var(--display);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.qa .bets button.on{background:#f5b301;border-color:#f5b301;color:#3b2a00}
.qa .bets button:disabled{opacity:.6}
.qa .boss{font:700 13px var(--display);color:#fff;background:#c2410c;border-radius:8px;padding:2px 8px;align-self:flex-start}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#f5b301 60%,#c98a00);box-shadow:inset 0 0 0 1.5px #b07800;vertical-align:-.12em}
#coins{display:none;align-items:center;gap:6px;font:700 20px var(--display);background:#fff8e1;border:2px solid #f5b301;border-radius:22px;padding:2px 12px 2px 8px;color:#3b2a00;position:relative;min-height:40px}
body.game #coins{display:inline-flex}body.game.show:not(.pulling) #coins{display:none}
#coins .fire{display:none;color:#c2410c;font-size:15px;align-items:center;gap:2px}#coins .fire.on{display:inline-flex}
#coins .fire svg{width:18px;height:18px;fill:#ea580c;stroke:none}
#coins.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.pop{position:fixed;z-index:60;font:800 34px var(--display);pointer-events:none;animation:pop 1.3s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 12px #fff}
.pop.y{color:#16a34a}.pop.n{color:#dc2626}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.25);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
#sumBox{position:fixed;inset:0;z-index:70;background:rgba(20,28,45,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#sumBox[hidden]{display:none}
#sumBox .in{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
#sumBox h2{font:700 22px var(--display);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
#sumBox .big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
#sumBox .big3 div{background:var(--bg);border-radius:12px;padding:10px 6px;font-size:13px;font-weight:600;color:var(--muted)}
#sumBox .big3 b{display:block;font:800 30px var(--display);color:var(--fg)}
#sumBox table{border-collapse:collapse;width:100%;font-size:13px}
#sumBox th,#sumBox td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
#sumBox td.c{text-align:center;font-weight:700}#sumBox .y{color:var(--good)}#sumBox .n{color:var(--bad)}
#sumBox .row{display:flex;gap:8px;flex-wrap:wrap}
#sumBox .row button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 14px;font:600 15px var(--body)}
.rq .m.a{color:#7b3fb0}
#note.red{color:var(--red)}

#scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px;background:#e9e3d8;touch-action:pan-x pan-y} /* two fingers zoom the sheet, not the whole page */
#page{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15)}
#page img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
#page canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#page canvas.ink{pointer-events:auto;touch-action:none}
body.scrolly #page canvas.ink{touch-action:pan-x pan-y}
#pages{padding:8px}
#page{margin:0;flex:none}
#page .play{position:absolute;z-index:5;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:var(--blue);color:#fff;
  display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.3);padding:0;touch-action:manipulation}
#page .play svg{width:26px;height:26px;margin-left:4px;fill:#fff;stroke:none}
#page .play::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--blue);opacity:.5;animation:playPulse 2s infinite}
@keyframes playPulse{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.25);opacity:0}}
#keyTag{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font:700 13px var(--display);border-radius:999px;padding:2px 10px}

/* ---------- screens ---------- */
body.show #bar h1::after{content:" · จอครู (แชร์ได้)";color:var(--blue)}
body.teacher #bar h1::after{content:" · จอครู (ซ่อน)";color:var(--red)}

/* ---------- #live: every student at once ---------- */
#live{height:100dvh;display:flex;flex-direction:column;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#live .lbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#live h1{font:700 1.05rem var(--display);margin:0}
#live h1 span{color:var(--red)}
#lNet{color:var(--bad);font-weight:600;font-size:14px}
#lCount{color:var(--muted);font-weight:600}
#grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,240px),1fr));gap:12px;align-content:start;padding:2px}
#lEmpty{color:var(--muted);font-weight:600;padding:24px;text-align:center;grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:opacity .3s}
.card.quiet{opacity:.55}
.card.fresh{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage)}
.card .ch{display:flex;justify-content:space-between;gap:6px;font:600 14px var(--display)}
.card .ch span:last-child{color:var(--muted);white-space:nowrap}
.card .pg{position:relative;background:#fff;border-radius:6px;overflow:hidden}
.card img,.card canvas,#fPage img,#fPage canvas{display:block;width:100%;height:auto;pointer-events:none}
.card canvas,#fPage canvas{position:absolute;inset:0;height:100%}
#focus{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#focus .lbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#focus h1{font:700 1.05rem var(--display);margin:0}
#focus h1 span:last-child{color:var(--red)}
#fNet{color:var(--bad);font-weight:600;font-size:14px}
#fNames{display:flex;gap:5px;flex-wrap:wrap}
#fDots{display:flex;gap:5px;overflow-x:auto;padding:3px 2px}#fDots button{flex:none}
#fNames button{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 14px;position:relative}
#fNames button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
#fNames button.fresh::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--sage);border:2px solid #fff}
#fNames button.quiet{opacity:.55}
#fNames .keychip{display:inline-flex;align-items:center;gap:5px;color:var(--good);border-color:var(--good)}
#fNames .keychip[aria-current="true"]{background:var(--good);color:#fff}
#fNames .keychip .ic{width:18px;height:18px}
#fDots button{min-width:38px;min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:600 13px var(--display);padding:0 3px}
#fDots button.ink{background:var(--mint)}
#fDots button.wait{position:relative}#fDots button.wait::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
#fDots button.here{box-shadow:inset 0 -4px 0 var(--sage)}
#fDots button[aria-current="true"]{outline:3px solid var(--navy);outline-offset:-3px}
#fWhere{color:var(--muted);font-weight:600}
#fScroll{flex:1;min-height:0;overflow:auto;border-radius:12px;background:#e9e3d8;padding:8px}
#fPage{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15);width:min(100%,1100px)}
#fWait b{font-weight:700}#fWait.has{background:#e07a1f;color:#fff;border-color:#e07a1f}
.wait{display:inline-block;min-width:20px;height:20px;border-radius:999px;background:#e07a1f;color:#fff;font:700 12px/20px var(--display);text-align:center;padding:0 5px;margin-left:5px}
/* the teacher's review of a student's answers */
#rev{width:min(380px,36vw);overflow:auto;display:flex;flex-direction:column;gap:8px;-webkit-user-select:text;user-select:text}
/* View 2026-10-28: #live in half a screen (a window beside the video call): the page gets the whole width, the answers sit above it,
   the bars get small (icons only) */
@media (max-width:1000px){
  #focus{gap:5px;padding:6px 8px}
  #focus h1{font-size:.9rem}#fWhere{font-size:13px}
  #focus .lbar .b{min-height:36px;padding:0 8px}#focus .lbar .b.i span{display:none}#focus .lbar .b.i #fWaitN{display:inline}
  #focus .lbar .b.i span:has(#fWaitN){display:inline}
  #fNames button{min-height:34px;padding:0 10px}
  #fDots button{min-width:32px;min-height:30px}
  #fWork{flex-direction:column;gap:5px}
  #rev{width:auto;max-height:24vh;order:-1;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:auto}
  #rev .rq{flex:1 0 min(320px,100%);padding:7px}
  #fScroll{padding:4px}
}
#rev .none{color:var(--muted);font-weight:600;padding:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.rq.waiting{border-color:#e07a1f;box-shadow:inset 4px 0 0 #e07a1f}
.rq h3{font:700 15px var(--display);margin:0;display:flex;justify-content:space-between;gap:6px;cursor:pointer}
.rq h3 span{color:var(--muted);font-weight:600;font-size:13px}
.rq .pa{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px;align-items:baseline}
.rq .pa .k{color:var(--muted);font-weight:600}
.rq .pa .v{font-weight:700;text-align:right}
.rq .pa .m{grid-column:1/-1;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.rq .m .ic{width:16px;height:16px}
.rq .m.y{color:var(--good)}.rq .m.n{color:var(--bad)}.rq .m.t{color:var(--muted)}
.rq textarea{font:500 15px var(--body);min-height:54px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--bg);resize:vertical}
.rq .btns{display:flex;gap:6px}
.rq .btns button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.rq .btns .y{color:var(--good)}.rq .btns .n{color:var(--bad)}
.rq .btns .y.on{background:var(--good);color:#fff;border-color:var(--good)}.rq .btns .n.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.rq .sent{font-size:13px;color:var(--muted);font-weight:600}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// key.json = the answer key pages, AES-GCM with the teacher code (tools/build-sheet-class.mjs); only the teacher screens fetch it
let KEYBLOB=null;
async function openKey(code){
  if(!KEYBLOB)KEYBLOB=await (await fetch("key.json",{cache:"no-cache"})).json();
  const B=KEYBLOB;
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.salt),iterations:B.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.iv)},key,b64(B.ct))));
}

const packInk=ink=>ink.map(s=>({c:s.c,e:s.e?1:0,d:5,...(s.z&&s.z!==1?{z:s.z}:{}),p:s.p.map((v,j)=>j%3===2?Math.round(v*9):Math.round(v*5000))}));
const arr=v=>Array.isArray(v)?v:v&&typeof v==="object"?Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]):[];   // Firebase may hand an array back as {0:…,1:…}
const unpackInk=ink=>arr(ink).filter(s=>s&&s.p).map(s=>{const d=s.d===5?5000:1000;return {c:s.c,e:!!s.e,...(s.z?{z:+s.z}:{}),p:arr(s.p).map((v,j)=>j%3===2?v/9:v/d)};});
async function post(body){
  let r,t;
  const ab=new AbortController(),tm=setTimeout(()=>ab.abort(),25000);
  try{r=await fetch(SHEET,{method:"POST",body:JSON.stringify(body),signal:ab.signal});t=await r.text();}
  catch(e){throw new Error("fetch: "+e.message);}finally{clearTimeout(tm);}
  let j;try{j=JSON.parse(t);}catch(e){throw new Error("HTTP "+r.status+": "+t.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,140));}

}

function fbStream(path,root,set,onNet,tf){

function pathSet(tree,path,data){           // returns the tree (a new one when the whole thing is replaced)

  for(const k of ks.slice(0,-1)){if(!o[k]||typeof o[k]!=="object")o[k]={};o=o[k];}
  const last=ks[ks.length-1];if(data==null)delete o[last];else o[last]=data;
  return tree;
}

function evalAns(raw){
  let t=String(raw||"").replace(/[,\s]/g,"").replace(/[−–]/g,"-").replace(/[×xX]/g,"*").replace(/²/g,"^2").replace(/³/g,"^3");
  t=((t.match(/^[0-9.+\-*/^()√π]+/)||[""])[0]).replace(/[+\-*/^(√]+$/,"");
  let i=0;const peek=()=>t[i];
  const num=()=>{const m=t.slice(i).match(/^\d*\.?\d+/);if(!m)return NaN;i+=m[0].length;return Number(m[0]);};
  const primary=()=>{const c=peek();if(c==="π"){i++;return Math.PI;}if(c==="√"){i++;return Math.sqrt(power());}
    if(c==="("){i++;const v=expr();if(peek()===")")i++;return v;}return num();};
  const power=()=>{const b=primary();if(peek()==="^"){i++;return b**unary();}return b;};
  const unary=()=>peek()==="-"?(i++,-unary()):power();
  const term=()=>{let v=unary();for(;;){const c=peek();
    if(c==="*"){i++;v*=unary();}else if(c==="/"){i++;v/=unary();}else if(c&&/[\dπ√(.]/.test(c))v*=power();else return v;}};
  const expr=()=>{let v=term();while(peek()==="+"||peek()==="-")v=t[i++]==="+"?v+term():v-term();return v;};
  if(!t)return NaN;const v=expr();return i===t.length?v:NaN;
}
function normU(u){                          // "m/s2", "m/s²", "เมตร/วินาที" … to one spelling

  for(const [a,b] of [["เซนติเมตร","cm"],["มิลลิเมตร","mm"],["มิลลิลิตร","ml"],["ลิตร","l"],["กิโลกรัม","kg"],["กรัม","g"],["เมตร","m"],
    ["นิวตัน","n"],["วินาที","s"],["เรเดียน","rad"],["องศา","°"],["degrees","°"],["degree","°"],["deg","°"],["ร้อยละ","%"],["เปอร์เซ็นต์","%"],["เท่า",""],["ส่วน",""]])t=t.split(a).join(b);

  const sr=scr.getBoundingClientRect(),pr=$("page").getBoundingClientRect();
  pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,z:zoom,
    fx:(mx-pr.left)/pr.width,fy:(my-pr.top)/pr.height,             // the spot of the sheet under the fingers stays under them
    ox:pr.left-sr.left+scr.scrollLeft,oy:pr.top-sr.top+scr.scrollTop};
},{passive:false});
scr.addEventListener("touchmove",e=>{
  if(!pinch)return;const f=fingers(e);if(f.length<2)return;
  if(e.cancelable)e.preventDefault();
  const [a,b]=f,mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
  zoom=Math.min(ZMAX,Math.max(ZMIN,pinch.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d));
  const [w,h]=size(),sr=scr.getBoundingClientRect();
  scr.scrollLeft=pinch.ox+pinch.fx*w-(mx-sr.left);scr.scrollTop=pinch.oy+pinch.fy*h-(my-sr.top);
},{passive:false});
function endPinch(e){if(pinch&&fingers(e).length<2){pinch=null;fit();}}
scr.addEventListener("touchend",endPinch);scr.addEventListener("touchcancel",endPinch);
// Safari's own page zoom
for(const t of ["gesturestart","gesturechange"])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
// stop iPad Safari turning a pencil stroke into a scroll (see tools/light-p5-shell.html); fingers still scroll in ✋ / pencil mode
$("page").addEventListener("touchstart",e=>{
  const stylus=[...e.changedTouches].some(t=>t.touchType==="stylus");
  if(stylus&&!penOnly){penOnly=true;try{localStorage.setItem("scitem-pen","1")}catch(err){}setScrolly();}
  const onSel=sel&&e.touches.length===1&&inSel(ptOf(e.touches[0]));   // a finger on a selection drags it instead of scrolling
  if(stylus||onSel||!(penOnly||hand))e.preventDefault();},{passive:false});
$("page").addEventListener("touchmove",e=>{if([...e.touches].some(t=>t.touchType==="stylus")||drag||!(penOnly||hand))e.preventDefault();},{passive:false});
setScrolly();

const press=(on,off)=>{on.setAttribute("aria-pressed","true");for(const b of off)b.setAttribute("aria-pressed","false");};
$("tPen").onclick=()=>{erase=false;sel=false;hand=false;unselect();press($("tPen"),[$("tErase"),$("tSel"),$("tHand")]);setScrolly();};
$("tErase").onclick=()=>{erase=true;sel=false;hand=false;unselect();press($("tErase"),[$("tPen"),$("tSel"),$("tHand")]);setScrolly();};
$("tSel").onclick=()=>{sel=true;erase=false;hand=false;press($("tSel"),[$("tPen"),$("tErase"),$("tHand")]);setScrolly();};
$("tHand").onclick=()=>{hand=!hand;$("tHand").setAttribute("aria-pressed",hand);setScrolly();};
$("tUndo").onclick=()=>{const l=myStrokes();if(!undoMove()){if(!l.length)return;l.pop();}SEL=null;changed();drawAll();};
$("tClear").onclick=()=>{const l=myStrokes();if(!l.length||!confirm(TEACHER?"ลบหมึกครูในหน้านี้?":SHOW?"ลบหมึกในหน้านี้?":"Clear this page?"))return;l.length=0;SEL=null;changed();drawAll();};
// View 2026-10-26: zoom with fingers only (no +/− buttons); a trackpad pinch (ctrl + wheel) on a computer
let wheelT=null;
scr.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();zoom=Math.min(ZMAX,Math.max(ZMIN,zoom*Math.exp(-e.deltaY/150)));size();clearTimeout(wheelT);wheelT=setTimeout(fit,120);},{passive:false});

/* ---------- Save PDF: every page with ink, one A4 each ---------- */
function pageImage(i,lists){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext("2d");g.drawImage(im,0,0);
      const l=document.createElement("canvas");l.width=c.width;l.height=c.height;const lx=l.getContext("2d");
      for(const list of lists){lx.clearRect(0,0,l.width,l.height);for(const s of list)drawStroke(lx,l,s);g.drawImage(l,0,0);}
      res(c.toDataURL("image/jpeg",0.8));
    };
    im.src="p/"+P(i)+".jpg";
  });
}
// Save PDF makes the PDF file itself (every page of the sheet with her ink, one A4 each) and hands it to the share sheet / a download:
// window.print() does nothing in some iPad browsers (in-app ones like LINE's). Sharing only works from the tap itself
// (not after an await), so the pages are drawn ahead: 3 s after the pen stops, and on the tap if anything changed (then tap again).
let printSig=null,printBusy=null,PRINTJ=[];
const printWork=i=>TEACHER?(SENT[P(i)]&&SENT[P(i)].ink)||[]:(W[P(i)]&&W[P(i)].ink)||[];
const printNow=()=>JSON.stringify([...Array(N).keys()].map(i=>[printWork(i),RED[redKey(i)]||[]]));
let printProg=null;                       // shows "PDF 12/48" while she waits for it
function prepPrint(){
  if(printBusy)return printBusy;
  const sig=printNow();if(sig===printSig)return Promise.resolve();
  return printBusy=(async()=>{
    const out=[];
    for(let i=0;i<N;i++){const ink=printWork(i),red=RED[redKey(i)]||[];   // View 2026-10-27: the whole sheet, every page
      const url=await pageImage(i,[ink,red]),im=new Image();im.src=url;await im.decode().catch(()=>{});
      const bin=atob(url.split(",")[1]),b=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)b[k]=bin.charCodeAt(k);
      out.push({b,w:im.naturalWidth,h:im.naturalHeight});if(printProg)printProg(i+1);}
    PRINTJ=out;printSig=sig;
  })().finally(()=>{printBusy=null;});
}
function makePdf(pages){                   // a plain PDF 1.4: each page one JPEG (DCTDecode), fitted to A4
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const put=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length;};
  const n=pages.length,size=3+3*n;
  put("%PDF-1.4\n");
  off[1]=len;put("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  off[2]=len;put(`2 0 obj<</Type/Pages/Count ${n}/Kids[${pages.map((_,k)=>(3+3*k)+" 0 R").join(" ")}]>>endobj\n`);
  pages.forEach((p,k)=>{
    const o=3+3*k,W=595.28,H=841.89,sc=Math.min(W/p.w,H/p.h),dw=(p.w*sc).toFixed(2),dh=(p.h*sc).toFixed(2),x=((W-p.w*sc)/2).toFixed(2),y=((H-p.h*sc)/2).toFixed(2);
    const cs=`q ${dw} 0 0 ${dh} ${x} ${y} cm /I Do Q`;
    off[o]=len;put(`${o} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</I ${o+2} 0 R>>>>/Contents ${o+1} 0 R>>endobj\n`);
    off[o+1]=len;put(`${o+1} 0 obj<</Length ${cs.length}>>stream\n${cs}\nendstream endobj\n`);
    off[o+2]=len;put(`${o+2} 0 obj<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.b.length}>>stream\n`);put(p.b);put("\nendstream endobj\n");
  });
  const xref=len;put(`xref\n0 ${size}\n0000000000 65535 f \n`+off.slice(1).map(v=>String(v).padStart(10,"0")+" 00000 n \n").join("")+`trailer<</Size ${size}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
function sharePdf(){
  if(!PRINTJ.length){flash(TEACHER?"ยังไม่มีงาน":"Nothing written yet");return;}
  const name=(CFG.title+" - "+(TEACHER?STU:ME.name||"")).replace(/[\\/:*?"<>|]+/g," ").trim()+".pdf";
  const file=new File([makePdf(PRINTJ)],name,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(e=>{if(e&&e.name!=="AbortError")dl(file);});return;}
  dl(file);
}
function dl(file){const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);}
$("saveBtn").onclick=()=>{
  if(printSig===printNow()&&!printBusy){sharePdf();return;}
  printProg=k=>{$("status").textContent="PDF "+k+"/"+N;};printProg(0);
  prepPrint().then(()=>{printProg=null;$("status").textContent="";
    if(!PRINTJ.length){flash(TEACHER?"ยังไม่มีงาน":"Nothing written yet");return;}
    $("toastT").textContent="PDF ready";$("toastGo").textContent="Save PDF";$("toast").hidden=false;   // a fresh tap for the share sheet
    clearTimeout(toastT);toastT=setTimeout(()=>{$("toast").hidden=true;},15000);
    $("toastGo").onclick=()=>{$("toast").hidden=true;sharePdf();};
  });
};
if(!STAFF)setTimeout(prepPrint,4000);
})();
