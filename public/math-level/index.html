<style>
/* Layout: one focused column; a five-rung "ladder" per topic carries the level idea through test and results. */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --ink: #17202E; --muted: #5B6676; --line: #DCE2EA;
  --accent: #0E8C86; --accent-ink: #FFFFFF; --good: #15803D; --good-bg: #E5F5EA; --bad: #C2410C; --bad-bg: #FDEDE3;
  --l1: #8FA3BA; --l2: #1FA39C; --l3: #2F74D8; --l4: #7553DB; --l5: #DD4B2E; --rung: #E3E8EF;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F141C; --surface: #18202B; --ink: #E8EDF4; --muted: #98A4B5; --line: #2A3442;
  --accent: #2CC1B9; --accent-ink: #062321; --good: #4ADE80; --good-bg: #12301E; --bad: #FB923C; --bad-bg: #3A1F10;
  --l1: #6E819A; --l2: #2CC1B9; --l3: #5B9AF0; --l4: #9B80F0; --l5: #F07055; --rung: #263140; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F141C; --surface: #18202B; --ink: #E8EDF4; --muted: #98A4B5; --line: #2A3442;
  --accent: #2CC1B9; --accent-ink: #062321; --good: #4ADE80; --good-bg: #12301E; --bad: #FB923C; --bad-bg: #3A1F10;
  --l1: #6E819A; --l2: #2CC1B9; --l3: #5B9AF0; --l4: #9B80F0; --l5: #F07055; --rung: #263140; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 18px; padding-block: 24px 48px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
sup { font-size: .7em; line-height: 0; vertical-align: .6em; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.1; margin: 0 .12em; font-size: .9em; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .2em .05em; }
.fr > span:last-child { padding: .05em .2em 0; }

/* ladder */
.ladder { display: flex; flex-direction: column-reverse; gap: 3px; }
.ladder i { display: block; height: 7px; border-radius: 3px; background: var(--rung); }
.ladder i.on.l1 { background: var(--l1); } .ladder i.on.l2 { background: var(--l2); } .ladder i.on.l3 { background: var(--l3); }
.ladder i.on.l4 { background: var(--l4); } .ladder i.on.l5 { background: var(--l5); }

/* start */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; margin-bottom: 22px; }
.hero h1 { font-size: clamp(34px, 7vw, 52px); font-weight: 800; line-height: 1; }
.hero p { color: var(--muted); margin: 10px 0 0; max-width: 46ch; }
.hero .bigladder { display: flex; gap: 6px; align-items: flex-end; }
.hero .bigladder div { width: 14px; border-radius: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
input[type=text], textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
.chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rules { margin: 0; padding-left: 20px; color: var(--ink); }
.rules li { margin: 4px 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.small { font-size: 14px; color: var(--muted); }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* test */
.bar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.bar .done { display: flex; gap: 4px; }
.bar .done span { width: 16px; height: 6px; border-radius: 3px; background: var(--rung); }
.bar .done span.fin { background: var(--accent); }
.bar .stat { font-family: var(--mono); font-size: 14px; color: var(--muted); }
.bar .stat b { color: var(--ink); }
.bar .sp { flex: 1; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; position: relative; overflow: hidden; }
.qhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.qnum { font-family: var(--display); font-weight: 800; font-size: 26px; }
.qtopic { font-weight: 700; }
.lvl { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.lvl .ladder { width: 26px; }
.lvl .tag { white-space: nowrap; font-family: var(--mono); font-weight: 700; font-size: 13px; border-radius: 6px; padding: 2px 8px; color: #fff; }
.qtext { font-size: clamp(19px, 3.6vw, 23px); line-height: 1.6; min-height: 70px; overflow-wrap: anywhere; }
.ans { margin-top: 20px; }
.numrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.numrow input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 22px; padding: 12px 14px; }
.unit { font-weight: 700; color: var(--muted); }
.pairrow { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 26px; flex-wrap: wrap; }
.pairrow input { width: 110px; font-family: var(--mono); font-size: 22px; text-align: center; padding: 10px 6px; }
.keys { display: flex; gap: 8px; margin-top: 10px; }
.keys button { border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; min-width: 44px; padding: 6px 10px; font-family: var(--mono); font-size: 18px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 19px; display: flex; gap: 12px; align-items: center; min-width: 0; }
.opt b { font-family: var(--mono); font-size: 14px; color: var(--muted); }
.opt[aria-pressed=true] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
.actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.actions .sp { flex: 1; }
.hint { font-size: 14px; color: var(--muted); margin-top: 8px; }
.fb { margin-top: 16px; border-radius: 12px; padding: 12px 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.fb.good { background: var(--good-bg); color: var(--good); }
.fb.bad { background: var(--bad-bg); color: var(--bad); }
.toast { position: absolute; right: 18px; top: 18px; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 14px; font-weight: 700;
         animation: pop 1.6s ease forwards; pointer-events: none; font-family: var(--display); }
@keyframes pop { 0% { transform: translateY(-8px); opacity: 0 } 12% { transform: none; opacity: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }
.pause { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); display: flex; align-items: center; justify-content: center; z-index: 5; }
.pause .panel { text-align: center; max-width: 360px; }

/* results */
.sumgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 20px; }
.sumgrid div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.sumgrid b { display: block; font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.chartbox { overflow-x: auto; }
.chart { display: grid; grid-template-columns: 34px repeat(var(--n), minmax(66px, 1fr)); gap: 0 8px; min-width: calc(34px + var(--n) * 74px); align-items: end; }
.chart .yax { display: flex; flex-direction: column-reverse; gap: 4px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.chart .yax span { height: 22px; line-height: 22px; }
.chart .col { display: flex; flex-direction: column-reverse; gap: 4px; }
.chart .col i { height: 22px; border-radius: 5px; background: var(--rung); }
.chart .col i.on.l1 { background: var(--l1); } .chart .col i.on.l2 { background: var(--l2); } .chart .col i.on.l3 { background: var(--l3); }
.chart .col i.on.l4 { background: var(--l4); } .chart .col i.on.l5 { background: var(--l5); }
.chart .xl { overflow-wrap: anywhere; hyphens: auto; font-size: 11.5px; text-align: center; padding-top: 6px; color: var(--ink); line-height: 1.2; }
.chart .xl b { display: block; font-family: var(--mono); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); margin-top: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; background: var(--c); vertical-align: -1px; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--bg); }
td.n, td.t { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.qq { min-width: 220px; }
.ok { color: var(--good); font-weight: 700; } .no { color: var(--bad); font-weight: 700; }
.codebox { font-family: var(--mono); font-size: 12px; word-break: break-all; max-height: 90px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
@media (max-width: 560px) {
  .opts { grid-template-columns: 1fr; } .sumgrid { grid-template-columns: 1fr 1fr; } .hero { grid-template-columns: 1fr; } .hero .bigladder { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>

function parseNum(raw) {

  return null;
}

  else if ((m = s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/))) { const [a, b] = decFrac(m[1]), [c, e] = decFrac(m[2]); n = a * e; d = b * c; }

/* ---------------- engine ---------------- */
function startTest(name, chosen, startLv) {
  const st = {};
  chosen.forEach(k => {
    const pools = {};
    for (let L = 1; L <= 5; L++) pools[L] = shuffle(BANK.map((b, i) => [b, i]).filter(([b]) => b.s === k && b.L === L).map(x => x[1]));
    st[k] = { start: (startLv && startLv[k]) || 2, level: (startLv && startLv[k]) || 2, tries: 0, ceiling: 0, dropped: false, done: false, pools, used: 0 };
  });
  S = { v: 1, b: BV, round: R2 ? 2 : 1, name, chosen, st, order: shuffle(chosen), ptr: 0, log: [], cur: null, streak: 0, best: 0,
        started: new Date().toISOString(), finished: false, activeMs: 0 };
  nextQuestion();
}
function pickStrand() {
  const active = S.order.filter(k => !S.st[k].done);
  if (!active.length) return null;
  const last = S.cur ? S.cur.s : null;
  // walk the order round-robin, skipping finished topics and avoiding the same topic twice in a row
  for (let step = 0; step < S.order.length * 2; step++) {
    const k = S.order[S.ptr % S.order.length]; S.ptr++;
    if (!S.st[k].done && (k !== last || active.length === 1)) return k;
  }
  return active[0];
}
function nextQuestion(resuming) {
  if (!resuming || !S.cur) {
    const k = pickStrand();
    if (!k) return finish();
    const t = S.st[k];
    const idx = t.pools[t.level][t.tries];
    const b = BANK[idx];
    S.cur = { s: k, L: t.level, idx, ord: b.t === "mc" ? shuffle(b.o.map((_, i) => i)) : null };
  }
  S.qStart = Date.now();
  save();
  renderQuestion();
}

    else if (b.t === "pair") { const x = canonOf(given[0]), y = canonOf(given[1]); key = x && y ? x + "," + y : null; }
    else key = "mc:" + given;
    ok = key !== null && b.h.includes(hsh(c.idx, key));
  }
  S.log.push({ s: c.s, L: c.L, i: c.idx, g: skipped ? null : given, ok, ms });
  let levelUp = false;
  if (ok) {
    S.streak++; S.best = Math.max(S.best, S.streak);
    t.ceiling = Math.max(t.ceiling, c.L); t.tries = 0;
    if (c.L === 5 || (t.dropped && c.L === 1)) t.done = true; else { t.level = c.L + 1; levelUp = true; }
  } else {
    S.streak = 0; t.tries++;
    if (t.tries >= 3) {
      t.tries = 0;
      if (c.L === 2 && t.ceiling === 0 && !t.dropped) { t.dropped = true; t.level = 1; }
      else t.done = true;
    }
  }
  S.cur = null;
  save();
  return { ok, levelUp, finishedTopic: t.done, topic: c.s, newLevel: t.level };
}
function finish() {
  stopTimer();
  S.finished = true; S.ended = new Date().toISOString();
  clearSave();
  renderDone(encodeResult(packResult()));
}

/* ---------------- question screen ---------------- */
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function renderQuestion(flash) {
  stopTimer();
  const c = S.cur, b = BANK[c.idx];
  const qn = S.log.length + 1;
  const fin = S.chosen.filter(k => S.st[k].done).length;
    let ansHTML = "";
  if (b.t === "num") {
    ansHTML = `<div class="numrow"><input type="text" id="a0" inputmode="text" autocomplete="off" aria-label="Your answer" placeholder="Your answer">${b.u ? `<span class="unit">${esc(b.u)}</span>` : ""}</div>
      <div class="keys"><button data-ins="-">${MINUS}</button><button data-ins="/">/</button><button data-ins=".">.</button></div>`;
  } else if (b.t === "pair") {
    ansHTML = `<div class="pairrow">(<input type="text" id="a0" aria-label="x-coordinate" placeholder="x" autocomplete="off">,<input type="text" id="a1" aria-label="y-coordinate" placeholder="y" autocomplete="off">)</div>
      <div class="keys"><button data-ins="-">${MINUS}</button><button data-ins="/">/</button></div>`;
  } else {
    ansHTML = `<div class="opts">${c.ord.map((oi, k) => `<button class="opt" data-oi="${oi}" aria-pressed="false"><b>${"ABCD"[k]}</b><span>${b.o[oi]}</span></button>`).join("")}</div>`;
  }
  app.innerHTML = `
  <div class="bar">
    <div class="done" title="Topics finished">${S.chosen.map(k => `<span class="${S.st[k].done ? "fin" : ""}"></span>`).join("")}</div>
    <span class="stat"><b>${fin}</b>/${S.chosen.length} topics</span>
    <span class="sp"></span>
    <span class="stat" id="clock">0:00</span>
    <button class="btn ghost" id="pause" style="padding:6px 12px">Pause</button>
  </div>
  <div class="qcard">
    <div class="qhead"><span class="qnum">Q${qn}</span><span class="qtopic">${esc(SNAME[c.s])}</span>
</div>
    <div class="qtext">${b.q}</div>
    <div class="ans">${ansHTML}</div>
    <div class="actions"><button class="btn" id="check">Submit</button><span class="sp"></span><button class="btn ghost" id="skip">I don't know</button></div>
    <div id="fbslot">${flash || ""}</div>
  </div>
  <p class="small" style="margin-top:12px">Write <b>Q${qn}</b> on your paper before you start.</p>`;
  const clock = document.getElementById("clock");
  timerId = setInterval(() => { clock.textContent = fmtT(Date.now() - S.qStart); }, 500);
  let choice = null;
  app.querySelectorAll(".opt").forEach(o => o.onclick = () => {
    app.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", "false"));
    o.setAttribute("aria-pressed", "true"); choice = +o.dataset.oi; });
  let lastInput = document.getElementById("a0");
  app.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("focus", () => lastInput = inp);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("check").click(); });
  });
  app.querySelectorAll("[data-ins]").forEach(k => k.onclick = () => {
    const inp = lastInput; if (!inp) return; const p = inp.selectionStart ?? inp.value.length;
    inp.value = inp.value.slice(0, p) + k.dataset.ins + inp.value.slice(inp.selectionEnd ?? p); inp.focus(); inp.setSelectionRange(p + 1, p + 1); });
  if (lastInput) lastInput.focus();
  const go = (given, skipped) => {
    submit(given, skipped);
    app.querySelectorAll("button, input").forEach(x => x.disabled = true);
    stopTimer();
    document.getElementById("fbslot").innerHTML = `<p class="hint">Answer saved</p>`;
    setTimeout(() => nextQuestion(), 350);
  };
  document.getElementById("check").onclick = () => {
    let given;
    if (b.t === "num") { given = document.getElementById("a0").value; if (!parseNum(given)) return warn("Type a number, for example -3/4, 2.5 or 1 1/2."); }
    else if (b.t === "pair") { given = [document.getElementById("a0").value, document.getElementById("a1").value];
      if (!parseNum(given[0]) || !parseNum(given[1])) return warn("Fill in both x and y with numbers."); }
    else { if (choice === null) return warn("Choose one answer."); given = choice; }
    go(given, false);
  };
  document.getElementById("skip").onclick = () => go(null, true);
  document.getElementById("pause").onclick = () => {
    stopTimer(); const pausedFor = Date.now() - S.qStart;
    const p = document.createElement("div"); p.className = "pause";
    p.innerHTML = `<div class="panel stack"><h2>Paused</h2><p class="small" style="margin:0">The question is hidden and the clock is stopped.</p><button class="btn" id="unpause">Resume</button></div>`;
    document.body.appendChild(p); app.querySelector(".qcard").style.visibility = "hidden";
    document.getElementById("unpause").onclick = () => { p.remove(); app.querySelector(".qcard").style.visibility = "";
      S.qStart = Date.now() - pausedFor; timerId = setInterval(() => { clock.textContent = fmtT(Date.now() - S.qStart); }, 500); };
  };
  function warn(t) { document.getElementById("fbslot").innerHTML = `<p class="hint">${t}</p>`; }
}

/* ---------------- results ---------------- */
function packResult() {
  return { v: 1, b: S.b || 1, round: S.round || 1, start: Object.fromEntries(S.chosen.map(k => [k, S.st[k].start || 2])), name: S.name, started: S.started, ended: S.ended, chosen: S.chosen, best: S.best,
    ceil: Object.fromEntries(S.chosen.map(k => [k, S.st[k].ceiling])),
    log: S.log.map(e => [e.s, e.L, e.i, e.g, e.ok ? 1 : 0, Math.round(e.ms / 1000)]) };
}
const XK = "SCItem-LevelFinder";
function xorStr(t) { let o = ""; for (let k = 0; k < t.length; k++) o += String.fromCharCode(t.charCodeAt(k) ^ XK.charCodeAt(k % XK.length)); return o; }
function encodeResult(r) { return "LF1-" + btoa(xorStr(unescape(encodeURIComponent(JSON.stringify(r))))); }
function decodeResult(code) {
  try { const c = code.trim().replace(/\s+/g, "").replace(/^LF1-/, ""); const r = JSON.parse(decodeURIComponent(escape(xorStr(atob(c))))); return r && r.v === 1 && Array.isArray(r.log) ? r : null; }
  catch (e) { return null; }
}
function answerText(b, g) {
  if (g == null) return "—";
  if (b.t === "mc") return b.o[g];
  if (b.t === "pair") return `(${esc(g[0])}, ${esc(g[1])})`;
  return esc(g);
}
function decOf(fs) { const [n, d] = fs.split("/"); if (!d) return ""; let q = +d; while (q % 2 === 0) q /= 2; while (q % 5 === 0) q /= 5;
  return q === 1 ? " (" + String(+n / +d).replace("-", MINUS) + ")" : ""; }
function correctText(b) {
  if (b.t === "mc") return b.o[b.a];
  if (b.t === "pair") return `(${fracStr(b.a[0])}, ${fracStr(b.a[1])})`;
  return fracStr(b.a) + decOf(b.a) + (b.u ? " " + esc(b.u) : "");
}
const lvText = (r, k) => { const c = r.ceil[k], st = (r.start && r.start[k]) || 2; return c === 0 && st > 2 ? "below L" + st : "L" + c; };
function roundHTML(r, idx) {
  const bank = BANKS[r.b || 1];
  const total = r.log.length, right = r.log.filter(e => e[4]).length, secs = r.log.reduce((a, e) => a + e[5], 0);
  const n = r.chosen.length;
  const cols = r.chosen.map(k => { const lv = r.ceil[k];
    return `<div class="col">${[1,2,3,4,5].map(x => `<i class="${x <= lv ? "on l" + lv : ""}"></i>`).join("")}</div>`; }).join("");
  const xl = r.chosen.map(k => `<div class="xl"><b>${lvText(r, k)}</b>${esc(SNAME[k])}</div>`).join("");
  const rows = r.log.map((e, j) => { const q = bank[e[2]];
    return `<tr><td class="n">${j + 1}</td><td>${esc(SNAME[e[0]])}</td><td class="n">L${e[1]}</td><td class="qq">${q.q}</td>
      <td>${answerText(q, e[3])}</td><td>${correctText(q)}</td><td class="${e[4] ? "ok" : "no"}">${e[4] ? "Right" : (e[3] == null ? "Skipped" : "Wrong")}</td><td class="t">${fmtT(e[5] * 1000)}</td></tr>`; }).join("");
  const when = r.started ? new Date(r.started).toLocaleString() : "";
  return `
  <h2 style="font-size:24px;margin:28px 0 2px">Round ${r.round || 1}</h2>
  <p class="small" style="margin:0">${esc(when)} · question set v${r.b || 1}</p>
  <div class="sumgrid">
    <div><span class="label">Questions</span><b>${total}</b></div>
    <div><span class="label">Right</span><b>${right}</b></div>
    <div><span class="label">Time</span><b>${fmtT(secs * 1000)}</b></div>
    <div><span class="label">Topics</span><b>${n}</b></div>
  </div>
  <div class="panel">
    <h3 style="font-size:18px;margin-bottom:12px">Highest level reached</h3>
    <div class="chartbox"><div class="chart" style="--n:${n}">
      <div class="yax">${[1,2,3,4,5].map(x => `<span>L${x}</span>`).join("")}</div>${cols}
      <div></div>${xl}
    </div></div>
    <div class="legend">${[1,2,3,4,5].map(x => `<span style="--c:var(--l${x})">L${x} ${LNAME[x]}</span>`).join("")}</div>
  </div>
  <h3 style="font-size:18px;margin:20px 0 10px">Every question · Round ${r.round || 1}</h3>
  <div class="tblwrap"><table><thead><tr><th>#</th><th>Topic</th><th>Level</th><th>Question</th><th>Answer given</th><th>Correct answer</th><th>Result</th><th>Time</th></tr></thead>
  <tbody>${rows}</tbody></table></div>`;
}
function renderResults(rs) {
  stopTimer();
  rs = (Array.isArray(rs) ? rs : [rs]).slice().sort((x, y) => (x.round || 1) - (y.round || 1) || String(x.started).localeCompare(String(y.started)));
  let cmp = "";
  if (rs.length > 1) {
    const keys = STRANDS.map(s => s[0]).filter(k => rs.some(r => r.chosen.includes(k)));
    cmp = `<div class="panel" style="margin-top:16px"><h3 style="font-size:18px;margin-bottom:10px">Round by round</h3>
    <div class="tblwrap"><table><thead><tr><th>Topic</th>${rs.map(r => `<th>Round ${r.round || 1}</th>`).join("")}</tr></thead><tbody>
    ${keys.map(k => `<tr><td>${esc(SNAME[k])}</td>${rs.map(r => `<td class="n">${r.chosen.includes(k) ? lvText(r, k) : "—"}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div></div>`;
  }
  app.innerHTML = `
  <div class="label">Result report</div>
  <h1 style="font-size:clamp(28px,6vw,40px);margin-top:4px">${esc(rs[0].name || "Student")} · Level Finder</h1>
  ${cmp}
  ${rs.map(roundHTML).join("")}
  <div class="row" style="margin-top:24px"><button class="btn ghost" id="home">Open other codes</button></div>`;
  document.getElementById("home").onclick = () => renderTeacher();
}

function renderDone(code) {
  app.innerHTML = `
  <div class="label">Test complete</div>
  <h1 style="font-size:clamp(30px,6vw,44px);margin:6px 0 10px">Well done${S.name ? ", " + esc(S.name) : ""}.</h1>
  <p style="margin:0 0 18px;color:var(--muted)">You answered ${S.log.length} questions. Copy the code below and send it to your teacher.</p>
  <div class="panel stack">
    <div class="codebox" id="codebox" style="max-height:140px">${code}</div>
    <div class="row"><button class="btn" id="copycode">Copy result code</button><span class="small" id="copied" aria-live="polite"></span></div>
  </div>`;
  document.getElementById("copycode").onclick = () => {
    const fallback = () => { const sel = window.getSelection(), rg = document.createRange(); rg.selectNodeContents(document.getElementById("codebox"));
      sel.removeAllRanges(); sel.addRange(rg); document.getElementById("copied").textContent = "Selected. Press Ctrl+C / Cmd+C to copy."; };
    try { navigator.clipboard.writeText(code).then(() => document.getElementById("copied").textContent = "Copied", fallback); } catch (e) { fallback(); }
  };
}
function renderTeacher(err) {
  app.innerHTML = `
  <div class="label">Teacher only · contains the answer key</div>
  <h1 style="font-size:clamp(30px,6vw,44px);margin:6px 0 16px">Level Finder Report</h1>
  <div class="panel stack">
    <label for="code" style="font-weight:700">Result code</label><textarea id="code" rows="4"></textarea>
    <label for="code2" style="font-weight:700">Second result code <span class="small">(optional, to compare two rounds)</span></label><textarea id="code2" rows="4"></textarea>
    <div class="row"><button class="btn" id="loadcode">Show report</button><span class="small" id="codeerr">${err ? esc(err) : ""}</span></div>
  </div>`;
  document.getElementById("loadcode").onclick = () => {
    const c1 = document.getElementById("code").value.trim(), c2 = document.getElementById("code2").value.trim();
    const rs = [c1, c2].filter(Boolean).map(decodeResult);
    if (!rs.length || rs.some(x => !x || !BANKS[x.b || 1])) { document.getElementById("codeerr").textContent = "A code could not be read. Copy the whole code and try again."; return; }
    renderResults(rs);
  };
}
if (MODE === "teacher") renderTeacher(); else renderStart();
</script>
