<title><!--TITLE--></title>

<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400..700&display=swap" rel="stylesheet">
<style>
:root { --ink:#1F2A44; --mute:#6B7785; --line:#E3E7EC; --blue:#2F80C9; --green:#2E8B57; --gbg:#E7F6EC; --red:#C62828; --rbg:#FDECEC; --orange:#E8962E; --paper:#FFFFFF; --soft:#F4F7FA; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--paper); color:var(--ink); }
body { font-family:'Andika',system-ui,sans-serif; font-size:18px; line-height:1.4; min-height:100dvh; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
.wrap { max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:0 16px; }
h1,h2,h3,.fred { font-family:'Fredoka',system-ui,sans-serif; font-weight:600; }
h1 { font-size:30px; margin:8px 0 4px; color:#3C3A8F; }
h2 { font-size:22px; margin:6px 0 10px; color:#3C3A8F; }
.btn { display:block; width:100%; border:0; border-radius:16px; padding:14px; font-family:'Fredoka'; font-weight:600; font-size:19px; letter-spacing:.3px; background:var(--green); color:#fff; box-shadow:0 4px 0 #1E6B41; }
.btn:active { transform:translateY(3px); box-shadow:0 1px 0 #1E6B41; }
.btn:disabled { background:#D5DADF; color:#8A929B; box-shadow:0 4px 0 #B8BEC4; }
.btn.red { background:var(--red); box-shadow:0 4px 0 #8E1C1C; }
.btn.ghost { background:#fff; color:var(--blue); border:2px solid var(--line); box-shadow:0 4px 0 var(--line); }
.hidden { display:none !important; }

/* name screen */
#scrName { text-align:center; padding-top:28px; }
#scrName input { width:100%; font:inherit; font-size:20px; padding:12px 14px; border:2px solid var(--line); border-radius:14px; margin:14px 0; text-align:center; }
.glowbig svg { width:150px; height:auto; }

/* path */
.top { display:flex; align-items:center; justify-content:space-between; padding:12px 0 6px; position:sticky; top:0; background:var(--paper); z-index:3; }
.chip { font-family:'Fredoka'; font-weight:600; border:2px solid var(--line); border-radius:999px; padding:3px 12px; font-size:16px; }
.chip.xp { color:var(--orange); border-color:#F5D6A8; }
.path { position:relative; padding:10px 0 30px; }
.node { display:flex; flex-direction:column; align-items:center; margin:14px 0; }
.node .dot { width:84px; height:84px; border-radius:50%; border:0; font-family:'Fredoka'; font-weight:700; font-size:30px; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.22); display:flex; align-items:center; justify-content:center; position:relative; }
.node .dot:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.22); }
.node.locked .dot { background:#D5DADF !important; color:#8A929B; }
.node .lab { font-family:'Fredoka'; font-weight:600; margin-top:8px; font-size:17px; }
.node .sub { font-size:14px; color:var(--mute); }
.node.l0 { transform:translateX(0); } .node.l1 { transform:translateX(70px); } .node.l2 { transform:translateX(0); } .node.l3 { transform:translateX(-70px); }
.node .crown { position:absolute; top:-10px; right:-8px; width:34px; height:34px; }
.node.next .dot { animation:bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform:translateY(-6px); } }
.sendline { text-align:center; font-size:14px; color:var(--mute); margin:0 0 24px; }
.sendline.bad { color:var(--red); }

/* lesson */
#scrLesson { padding-bottom:180px; }
.lhead { display:flex; align-items:center; gap:12px; padding:12px 0; position:sticky; top:0; background:var(--paper); z-index:3; }
.x { border:0; background:none; width:36px; height:36px; padding:0; color:var(--mute); }
.bar { flex:1; height:16px; background:var(--line); border-radius:99px; overflow:hidden; }
.bar i { display:block; height:100%; width:0; background:var(--green); border-radius:99px; transition:width .4s; }
.say { display:flex; gap:8px; align-items:flex-start; margin:6px 0 12px; }
.say .me svg { width:70px; height:auto; }
.say .bub { flex:1; border:2px solid var(--blue); background:#F2F8FD; border-radius:16px; padding:10px 14px; position:relative; }
.q { font-size:20px; font-weight:700; margin:4px 0 12px; }
.tag { font-family:'Fredoka'; font-weight:600; font-size:14px; color:var(--blue); text-transform:uppercase; letter-spacing:1px; }
.tag.boss { color:var(--red); }
.pic { text-align:center; margin:4px 0 10px; }
.pic svg { width:100%; max-width:340px; height:auto; }
.pic.tap { cursor:pointer; }
.tapme { font-size:14px; color:var(--orange); font-family:'Fredoka'; font-weight:600; text-align:center; margin-top:-4px; }
.tip { background:#FFF8EA; border:2px dashed #F5D6A8; border-radius:14px; padding:8px 12px; margin-top:8px; font-size:16px; }
.opts { display:flex; flex-direction:column; gap:10px; }
.opt { text-align:left; border:2px solid var(--line); background:#fff; border-radius:16px; padding:12px 14px; box-shadow:0 3px 0 var(--line); font-size:18px; }
.opt.sel { border-color:var(--blue); background:#EAF3FC; box-shadow:0 3px 0 #9DBFE0; }
.opts.pics { flex-direction:row; }
.opts.pics .opt { flex:1; padding:6px; text-align:center; }
.opts.pics svg { width:100%; height:auto; }
.opt:disabled { opacity:1; }
.slots { min-height:58px; border-bottom:2px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; padding:8px 0; margin-bottom:14px; }
.slots.col, .bank.col { flex-direction:column; flex-wrap:nowrap; }
.bank { display:flex; flex-wrap:wrap; gap:8px; }
.tile { border:2px solid var(--line); background:#fff; border-radius:12px; padding:8px 12px; box-shadow:0 3px 0 var(--line); font-size:17px; text-align:left; }
.tile.used { visibility:hidden; }
.tile .n { font-family:'Fredoka'; font-weight:700; color:var(--blue); margin-right:6px; }
.mgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.mcol { display:flex; flex-direction:column; gap:10px; }
.mcol .tile { min-height:58px; }
.tile.pick { border-color:var(--blue); background:#EAF3FC; }
.tile.p0 { border-color:#2E8B57; background:#E7F6EC; } .tile.p1 { border-color:#7B61C9; background:#F0ECFA; }
.tile.p2 { border-color:#E8962E; background:#FFF4E2; } .tile.p3 { border-color:#C2557A; background:#FCEAF0; }

/* check panel */
.foot { position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:2px solid var(--line); padding:14px 16px max(16px, env(safe-area-inset-bottom)); z-index:5; }
.foot .in { max-width:520px; margin:0 auto; }
.foot.ok { background:var(--gbg); border-color:#BFE6CC; }
.foot.no { background:var(--rbg); border-color:#F5C4C4; }
.fb { display:flex; gap:10px; align-items:flex-start; margin-bottom:12px; }
.fb .ic { flex:0 0 40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; }
.fb h3 { margin:0; font-size:21px; }
.foot.ok h3 { color:var(--green); } .foot.no h3 { color:var(--red); }
.fb p { margin:2px 0 0; font-size:16px; }
.plus { font-family:'Fredoka'; font-weight:700; color:var(--orange); }

/* done */
#scrDone { text-align:center; padding-top:30px; }
.stats { display:flex; gap:10px; margin:18px 0 24px; }
.stat { flex:1; border:2px solid var(--line); border-radius:16px; padding:10px 4px; }
.stat b { display:block; font-family:'Fredoka'; font-size:26px; }
.stat span { font-size:13px; color:var(--mute); }
.badge svg { width:150px; height:150px; }
@keyframes pop { 0% { transform:scale(.4); opacity:0 } 70% { transform:scale(1.1) } 100% { transform:scale(1); opacity:1 } }
.pop { animation:pop .5s ease-out both; }
@keyframes spin { to { transform:rotate(360deg) } }
.spin .wh { animation:spin .35s linear infinite; transform-origin:150px 85px; }
.mixw, .wh { transform-box:view-box; }
.mixw { opacity:0; transition:opacity 1.2s .3s; }
.spin .mixw { opacity:.82; }
.draw path.fan, .draw .lit { opacity:0; transition:opacity .5s; }
.on path.fan, .on .lit { opacity:1; }
.on path.fan { transition-delay:calc(var(--d) * 80ms + .3s); }
.trace { stroke-dasharray:1; stroke-dashoffset:1; }
.on .trace { transition:stroke-dashoffset 1.6s ease-in-out; stroke-dashoffset:0; }
.band { cursor:pointer; }
/* live mode */
body.watch .wrap { max-width:640px; }
#net { position:fixed; top:8px; left:50%; transform:translateX(-50%); background:#1F2A44; color:#fff; font-size:13px; border-radius:99px; padding:4px 12px; z-index:9; font-family:'Sarabun',sans-serif; }
body.teach .wrap { max-width:none; padding:0; }
#scrTeach { min-height:100dvh; display:flex; flex-direction:column; }
.tbar { display:flex; gap:6px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:4; flex-wrap:wrap; }
.tbar button, .tbar select { font:inherit; font-size:15px; min-height:38px; min-width:38px; border:1px solid var(--line); background:#fff; border-radius:10px; padding:0 10px; }
.tbar button.on { background:#1F2A44; color:#fff; }
.tbar .sw { width:32px; min-width:32px; padding:0; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px var(--line); }
.tbar .sw.on { box-shadow:0 0 0 3px #1F2A44; }
.tsp { flex:1; }
#tno { font-family:'Fredoka'; font-weight:600; min-width:4em; text-align:center; }
.tinfo { display:flex; gap:10px; align-items:center; padding:6px 16px; flex-wrap:wrap; min-height:34px; }
#tmode { font-family:'Fredoka'; font-weight:600; color:var(--green); font-size:15px; }
#tdots { display:flex; gap:8px; flex-wrap:wrap; }
.tgrp { display:inline-flex; gap:4px; margin-left:8px; }
.sd { font-size:14px; border:1.5px solid var(--line); border-radius:99px; padding:2px 10px; color:var(--mute); }
.sd.in { border-color:#9DBFE0; color:var(--blue); }
#tstage { position:relative; flex:1; }
#tcard { max-width:900px; margin:0 auto; padding:10px 28px 60px; font-size:22px; }
#tcard .q { font-size:28px; } #tcard h2 { font-size:32px; } #tcard .pic svg { max-width:520px; }
#tcard .opts .opt, #tcard .tile { font-size:21px; }
#tcard .opts.pics svg { max-width:180px; }
#ink { position:absolute; left:0; top:0; width:100%; touch-action:none; }
.opt.key { border:3px solid var(--red); background:#FDECEC; box-shadow:0 3px 0 #F5C4C4; }
.keybox { border:3px solid var(--red); border-radius:14px; padding:10px 14px; background:#FDECEC; font-size:17px; }
#tans { margin-top:18px; display:flex; flex-direction:column; gap:10px; }
.tanswer { display:flex; gap:14px; align-items:center; border:2px solid var(--line); border-radius:14px; padding:10px 14px; background:#fff; flex-wrap:wrap; }
.tanswer.ok { border-color:#9FD6B2; background:var(--gbg); } .tanswer.no { border-color:#F5C4C4; background:var(--rbg); }
.tanswer > b { font-family:'Fredoka'; min-width:90px; } .tv { flex:1; font-size:20px; } .tv .mpic svg { width:110px; }
.tbtn { display:flex; gap:8px; }
.tbtn button { font:inherit; font-family:'Fredoka'; font-weight:600; font-size:18px; border-radius:12px; padding:8px 18px; border:2px solid var(--line); background:#fff; }
.tbtn button[data-ok="1"] { color:var(--green); border-color:#9FD6B2; } .tbtn button[data-ok="0"] { color:var(--red); border-color:#F5C4C4; }
.tbtn button[data-ok="1"].on { background:var(--green); color:#fff; } .tbtn button[data-ok="0"].on { background:var(--red); color:#fff; }
.tres { font-family:'Fredoka'; color:var(--mute); }
.mpic svg { width:70px; height:auto; vertical-align:middle; }
body.watch .wrap { max-width:640px; }
.wbar { display:flex; gap:6px; align-items:center; padding:10px 0; position:sticky; top:0; background:var(--paper); z-index:3; border-bottom:1px solid var(--line); }
.wbar button, .wbar select { font:inherit; font-size:15px; min-height:38px; min-width:38px; border:1px solid var(--line); background:#fff; border-radius:10px; padding:0 8px; max-width:55vw; }
#wno { font-family:'Fredoka'; font-weight:600; min-width:3.6em; text-align:center; }
.wbar .fred { color:var(--red); }
.wpage { padding:10px 0; }
.wwhy { border:2px dashed #F5C4C4; border-radius:14px; padding:10px 14px; margin:8px 0 40px; background:#FFFBFB; font-family:'Sarabun',sans-serif; font-size:16px; }
.wwhy b { color:var(--red); } .wwhy p { margin:2px 0 10px; }
</style>

function ready(on) { $("act").disabled = !on; if (SELHOOK) setTimeout(SELHOOK, 0); }

function renderChoice(c, box) {
  var pics = typeof c.opts[0] === "object", sel = null;
  var opts = shuffle(c.opts);
  box.innerHTML = '<div class="opts' + (pics ? " pics" : "") + '">' + opts.map(function (o, k) {
    return '<button class="opt" data-k="' + k + '">' + (pics ? PICS[o.pic]() : esc(o)) + '</button>'; }).join("") + '</div>';
  box.querySelectorAll(".opt").forEach(function (b) { b.onclick = function () {
    box.querySelectorAll(".opt").forEach(function (x) { x.classList.toggle("sel", x === b); });
    var o = opts[+b.getAttribute("data-k")]; sel = pics ? o.k : o; ready(true); }; });
  return function () { return sel; };
}
function renderOrder(c, box) {
  var long = c.tiles.some(function (t) { return t.length > 14; });
  var bank = shuffle(c.tiles), picked = [];
  function draw() {
    box.innerHTML = '<div class="slots' + (long ? " col" : "") + '">' + picked.map(function (k, n) { return '<button class="tile" data-p="' + n + '">' + (long ? '<span class="n">' + (n + 1) + '</span>' : "") + esc(bank[k]) + '</button>'; }).join("") + '</div>' +
      '<div class="bank' + (long ? " col" : "") + '">' + bank.map(function (t, k) { return '<button class="tile' + (picked.indexOf(k) >= 0 ? " used" : "") + '" data-k="' + k + '">' + esc(t) + '</button>'; }).join("") + '</div>';
    box.querySelectorAll("[data-k]").forEach(function (b) { b.onclick = function () { var k = +b.getAttribute("data-k"); if (picked.indexOf(k) < 0) { picked.push(k); draw(); } }; });
    box.querySelectorAll("[data-p]").forEach(function (b) { b.onclick = function () { picked.splice(+b.getAttribute("data-p"), 1); draw(); }; });
    ready(picked.length === bank.length);
  }
  draw();
  return function () { return picked.map(function (k) { return bank[k]; }).join("|"); };
}
function renderMatch(c, box) {
  var rights = shuffle(c.rights), pair = {}, pickL = null;   // pair[leftIndex] = rightIndex
  function draw() {
    var used = {}; Object.keys(pair).forEach(function (l) { used[pair[l]] = +l; });
    box.innerHTML = '<div class="mgrid"><div class="mcol">' + c.lefts.map(function (t, l) {
      return '<button class="tile' + (pair[l] != null ? " p" + l : pickL === l ? " pick" : "") + '" data-l="' + l + '">' + esc(t) + '</button>'; }).join("") +
      '</div><div class="mcol">' + rights.map(function (t, r) {
      return '<button class="tile' + (used[r] != null ? " p" + used[r] : "") + '" data-r="' + r + '">' + esc(t) + '</button>'; }).join("") + '</div></div>';
    box.querySelectorAll("[data-l]").forEach(function (b) { b.onclick = function () { var l = +b.getAttribute("data-l"); if (pair[l] != null) delete pair[l]; else pickL = pickL === l ? null : l; draw(); }; });
    box.querySelectorAll("[data-r]").forEach(function (b) { b.onclick = function () { var r = +b.getAttribute("data-r");
      if (used[r] != null) { delete pair[used[r]]; } else if (pickL != null) { pair[pickL] = r; pickL = null; } draw(); }; });
    ready(Object.keys(pair).length === c.lefts.length);
  }
  draw();
  return function () { return c.lefts.map(function (t, l) { return t + "=" + (pair[l] != null ? rights[pair[l]] : "?"); }).join("|"); };
}

var OKIC = '<span class="ic"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#2E8B57" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
var NOIC = '<span class="ic"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 6l12 12M18 6L6 18" stroke="#C62828" stroke-width="3.2" stroke-linecap="round"/></svg></span>';
var PRAISE = ["Great job!", "Correct!", "Brilliant!", "You got it!", "Super!"];
function check(it, canon) {
  $("act").disabled = true;
  hashOf(it.id, canon).then(function (h) {
    $("card").querySelectorAll("button").forEach(function (b) { b.disabled = true; });
    if (LS.live) liveRecord(it.id, canon, h === it.c.h);
    if (h === it.c.h) {
      var gain = it.tries ? 5 : 10; LS.xp += gain; if (!it.tries) LS.first++;
      return unlock(it.id, canon, it.c.x).then(function (why) {
        foot("ok", OKIC + '<div><h3>' + PRAISE[Math.floor(Math.random() * PRAISE.length)] + ' <span class="plus">+' + gain + ' XP</span></h3><p>' + esc(why) + '</p></div>', "Continue", true);
        $("act").onclick = function () { LS.queue.shift(); LS.done++; next(); };
      });
    }
    it.tries++; if (it.tries === 1) LS.missed.push(it.c.tag + (it.c.type === "choice" && typeof canon === "string" && canon.length < 60 ? ' (chose "' + canon + '")' : ""));
    foot("no", NOIC + '<div><h3>Not quite</h3><p>' + esc(it.c.hint) + ' This one comes back later.</p></div>', "Got it", true);
    $("act").onclick = function () { LS.queue.push(LS.queue.shift()); next(); };
  });
}

function finish() {
  var L = DATA.lessons[LS.i], mins = Math.max(1, Math.round((Date.now() - LS.t0) / 60000)), prev = S.done[LS.i];
  S.xp += LS.xp;
  S.done[LS.i] = { first: LS.first, total: LS.nq, mins: mins, missed: LS.missed, at: Date.now(), times: (prev ? prev.times : 0) + 1 };
  save(); send();
  var all = DATA.lessons.every(function (_, i) { return S.done[i]; });
  var h = '<div class="glowbig pop">' + GLOW + '</div><h1>Lesson complete!</h1><p>' + esc(L.title) + '</p>' +
    '<div class="stats"><div class="stat"><b style="color:#E8962E">+' + LS.xp + '</b><span>XP</span></div><div class="stat"><b style="color:#2E8B57">' + LS.first + '/' + LS.nq + '</b><span>right first try</span></div><div class="stat"><b style="color:#2F80C9">' + mins + '</b><span>min</span></div></div>';
  if (all && (!prev || LS.i === DATA.lessons.length - 1)) h += '<div class="badge pop">' + badgeSvg("#E8962E", true) + '</div><h2>You are a ' + esc(DATA.badge) + '!</h2><p>You finished every lesson of the Light unit.</p>';
  h += '<button class="btn" id="back">Continue</button>';
  $("scrDone").innerHTML = h; show("scrDone");
  $("back").onclick = LS.live ? liveWait : pathScreen;
}

/* ---------- results to Teacher View (one line per lesson) ---------- */
function resultLines() {
  var n = DATA.lessons.filter(function (_, i) { return S.done[i]; }).length, out = ["Lessons " + n + "/" + DATA.lessons.length + " · " + S.xp + " XP"];
  DATA.lessons.forEach(function (L, i) { var d = S.done[i]; if (!d) return;
    out.push("L" + (i + 1) + " " + L.title + ": " + d.first + "/" + d.total + " first try · " + d.mins + " min" + (d.times > 1 ? " · done " + d.times + " times" : "") + (d.missed.length ? " · missed: " + d.missed.join("; ") : "")); });
  return out;
}
function send() {
  var lines = resultLines();
  fetch(SHEET_URL, { method: "POST", body: JSON.stringify({ action: "submit", id: S.sid.slice(-20), quiz: DATA.id, name: S.name || "No name", answers: lines, secs: [] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw 0; S.sendErr = false; S.sentAt = Date.now(); save(); var sl = $("sendline"); if (sl) { sl.className = "sendline"; sl.textContent = "Results sent to Teacher View."; } })
    .catch(function () { S.sendErr = true; save(); });
}

/* =====================================================================
   LIVE CLASS (3 screens). View 2026-11-09:
   #live  = student phone: the exercises, one card at a time with the teacher ("one") or a whole part at her own pace ("part")
   #teach = show screen (shared): controls the session and the phones, big card + pen, shows what the student sent,
            the teacher taps ถูก / ยังไม่ถูก there and the phone gets the result. Signs in once as the teacher (Firebase).
   #watch = hidden screen: the answer book only. The teacher pages through it on her own: each card laid out like the
            other screens, the answer marked, and why. Needs only the key password, no Firebase.
   Firebase Realtime DB over REST (rules: tools/firebase-rules.json, the same as the live sheet classes):
     live/<CLS>/<uid> = {n, at, cur: card on screen, a: {cardId: {v: sent, at, tries, ok?, ok1?, auto?}}}   student writes own
     back/<CLS>/<uid> = {mode: "wait"|"one"|"part", li, pos, mark: {cardId: {ok, for: sent at}}}             show screen writes
   In "one" mode the phone does not check: the teacher's mark is the result. In "part" mode the phone checks itself (hash).
   Answer book: DATA.key, AES-GCM with a key from the key password (PBKDF2); the password stays outside the repo.
   ===================================================================== */
var FB = { key: "AIzaSyClZhItG5C3aaz413ToeXPDKzh6Aw5y9CU", db: "https://scitem-live-default-rtdb.asia-southeast1.firebasedatabase.app" }; // = FIREBASE in src/data/catalog.ts
var FB_TEACHER = "teacher@scitem.net", CLS = DATA.id.replace(/[^a-z0-9]/gi, ""), MODE = (location.hash.match(/^#(live|teach|watch)/) || [])[1] || "";
var AUTH = null, AKEY = CLS + "-auth-" + MODE;
function fbPost(url, body, form) {
  return fetch(url, { method: "POST", headers: { "Content-Type": form ? "application/x-www-form-urlencoded" : "application/json" }, body: form ? body : JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || "HTTP " + r.status); return j; }); });
}
function authSet(a) {
  AUTH = { uid: a.localId || a.user_id, id: a.idToken || a.id_token, rt: a.refreshToken || a.refresh_token, exp: Date.now() + 1000 * (+(a.expiresIn || a.expires_in) || 3600) };
  try { localStorage.setItem(AKEY, JSON.stringify({ uid: AUTH.uid, rt: AUTH.rt })); } catch (e) {}
  return AUTH.id;
}
var authP = null;
function token() {
  if (AUTH && AUTH.exp > Date.now() + 120000) return Promise.resolve(AUTH.id);
  return authP || (authP = token1().finally(function () { authP = null; }));
}
function token1() {
  var old = AUTH; if (!old) try { old = JSON.parse(localStorage.getItem(AKEY) || "null"); } catch (e) {}
  var fresh = function () {
    if (MODE === "live") return fbPost("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + FB.key, { returnSecureToken: true }).then(authSet);
    var pw = prompt("รหัส Firebase ของ " + FB_TEACHER + " (รหัสเดียวกับจอ #live ของห้องเรียนสด) ใส่ครั้งเดียวในเครื่องนี้");
    if (!pw) return Promise.reject(new Error("no password"));
    return fbPost("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + FB.key, { email: FB_TEACHER, password: pw.trim(), returnSecureToken: true }).then(authSet);
  };
  if (old && old.rt) return fbPost("https://securetoken.googleapis.com/v1/token?key=" + FB.key, "grant_type=refresh_token&refresh_token=" + encodeURIComponent(old.rt), true).then(authSet, fresh);
  return fresh();
}
function fbUrl(root, path, tok) { return FB.db + "/" + root + "/" + CLS + path + ".json?auth=" + encodeURIComponent(tok); }
function fbWrite(method, root, path, data) {
  return token().then(function (t) { return fetch(fbUrl(root, path, t), { method: method, body: JSON.stringify(data) }); })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); net(""); }).catch(function (e) { net("ส่งไม่ได้ (" + e.message + ") ลองใหม่…"); });
}
function pathSet(tree, path, data) {
  var ks = path.split("/").filter(Boolean);
  if (!ks.length) return data && typeof data === "object" ? data : {};
  var o = tree; ks.slice(0, -1).forEach(function (k) { if (!o[k] || typeof o[k] !== "object") o[k] = {}; o = o[k]; });
  var last = ks[ks.length - 1]; if (data == null) delete o[last]; else o[last] = data; return tree;
}
function fbStream(root, path, onChange) {
  var es = null, tree = {};
  var go = function () {
    if (es) es.close();
    token().then(function (t) {
      var me = es = new EventSource(fbUrl(root, path, t));
      var on = function (ty, fn) { me.addEventListener(ty, function (ev) { if (me === es) fn(ev.data ? JSON.parse(ev.data) : null); }); };
      on("put", function (d) { tree = pathSet(tree, d.path, d.data); onChange(tree); });
      on("patch", function (d) { var b = d.path.replace(/\/+$/, ""); Object.keys(d.data || {}).forEach(function (k) { tree = pathSet(tree, b + "/" + k, d.data[k]); }); onChange(tree); });
      on("auth_revoked", function () { AUTH.exp = 0; go(); });
      on("cancel", function () { me.close(); net("อ่านไม่ได้: เช็ค Rules ใน Firebase"); });
      me.onopen = function () { net(""); };
      me.onerror = function () { net("หลุด กำลังต่อใหม่…"); };
    }, function (e) { net("ต่อไม่ได้ (" + e.message + ")"); setTimeout(go, 5000); });
  };
  go();
}
function net(t) { var n = $("net"); if (n) { n.textContent = t; n.classList.toggle("hidden", !t); } }
function cardAt(pos) { var p = String(pos || "").split("-"), L = DATA.lessons[+p[0]]; return L && L.cards[+p[1]] ? { li: +p[0], ci: +p[1], c: L.cards[+p[1]], id: pos } : null; }
function allPos() { var out = []; DATA.lessons.forEach(function (L, li) { L.cards.forEach(function (_, ci) { out.push(li + "-" + ci); }); }); return out; }
function pickHtml(c, v) {   // a sent answer as the teacher reads it
  if (v == null || v === "") return '<span class="hint">—</span>';
  if (c.type === "choice") { if (typeof c.opts[0] === "object") { var o = c.opts.filter(function (o) { return o.k === v; })[0]; return o ? '<span class="mpic">' + PICS[o.pic]() + '</span>' : esc(v); } return esc(v); }
  if (c.type === "order") return String(v).split("|").map(function (t, i) { return (i + 1) + ". " + esc(t); }).join("<br>");
  return String(v).split("|").map(function (p) { return esc(p.replace("=", " → ")); }).join("<br>");
}
function staticCard(c, key) {   // a card laid out like the phone; key = the right answer to mark (answer book only)
  var h = "";
  if (c.type === "teach") {
    h = '<h2>' + esc(c.title) + '</h2><div class="say"><div class="me">' + GLOW + '</div><div class="bub">' + c.text + '</div></div>';
    if (c.pic) h += '<div class="pic' + (TAPS[c.pic] ? " tap" : "") + '" id="pic">' + PICS[c.pic]() + '</div>';

  }
  h = '<div class="tag' + (c.boss ? " boss" : "") + '">' + (c.boss ? "Boss question" : c.type === "order" ? "Put in order" : c.type === "match" ? "Match" : "Choose") + '</div><div class="q">' + esc(c.q) + '</div>';
  if (c.pic) h += '<div class="pic">' + PICS[c.pic]() + '</div>';
  if (c.type === "choice") { var pics = typeof c.opts[0] === "object";
    h += '<div class="opts' + (pics ? " pics" : "") + '">' + c.opts.map(function (o) { var k = pics ? o.k : o;
      return '<div class="opt' + (key != null && k === key ? " key" : "") + '">' + (pics ? PICS[o.pic]() : esc(o)) + '</div>'; }).join("") + '</div>'; }
  else if (key != null) h += '<div class="keybox">' + pickHtml(c, key) + '</div>';
  else if (c.type === "order") h += '<div class="bank">' + c.tiles.map(function (t) { return '<div class="tile">' + esc(t) + '</div>'; }).join("") + '</div>';
  else h += '<div class="mgrid"><div class="mcol">' + c.lefts.map(function (t) { return '<div class="tile">' + esc(t) + '</div>'; }).join("") + '</div><div class="mcol">' + c.rights.map(function (t) { return '<div class="tile">' + esc(t) + '</div>'; }).join("") + '</div></div>';
  return h;

/* ---------- student phone ---------- */
var LIVE = { mine: {}, ctl: {}, marks: {} };
function liveCur(id) { if (MODE === "live" && AUTH) fbWrite("PATCH", "live", "/" + AUTH.uid, { cur: id, at: Date.now() }); }
function liveRecord(id, canon, ok) {   // "part" mode: the phone checked it
  var prev = LIVE.mine[id] || null;
  var rec = { v: canon, at: Date.now(), tries: (prev ? prev.tries : 0) + 1, ok: ok || !!(prev && prev.ok), ok1: prev ? !!prev.ok1 : ok, auto: 1 };
  LIVE.mine[id] = rec; fbWrite("PUT", "live", "/" + AUTH.uid + "/a/" + id, rec);
  return prev;
}
SELHOOK = null;
function waitHtml(t) { return '<div class="say" style="margin-top:30px"><div class="me">' + GLOW + '</div><div class="bub">' + t + '</div></div>'; }
function bare() { show("scrLesson"); $("quit").classList.add("hidden"); $("prog").parentNode.classList.add("hidden"); }
function liveWait() {
  LS = null; CUR_GET = null; bare();
  $("card").innerHTML = waitHtml("Hi " + esc(S.name) + "! Look at Teacher View's screen. Your next exercise will show up here.");
  $("foot").classList.add("hidden"); liveCur("");
}
function liveStudent() {
  document.body.classList.add("live");
  if (!S.name) { nameScreen(); $("go").onclick = function () { S.name = $("nm").value.trim(); save(); liveStudent(); }; return; }
  liveWait();
  token().then(function () {
    fbWrite("PATCH", "live", "/" + AUTH.uid, { n: S.name, at: Date.now() });
    fbStream("live", "/" + AUTH.uid + "/a", function (t) { LIVE.mine = t || {}; });
    fbStream("back", "/" + AUTH.uid, liveRoute);
  }, function (e) { net("ต่อไม่ได้ (" + e.message + ")"); });
}
function liveRoute(t) {
  t = JSON.parse(JSON.stringify(t || {}));   // a copy: the stream changes its tree in place, and old must stay old
  var old = LIVE.ctl; LIVE.ctl = t; LIVE.marks = t.mark || {};
  if (t.mode === "part") {   // a whole part at her own pace, checked on the phone
    if (LS && LS.live && LS.i === +t.li && old.mode === "part") return;
    startLesson(+t.li); LS.live = true; $("quit").classList.add("hidden"); $("prog").parentNode.classList.remove("hidden");
    LS.queue = LS.queue.filter(function (it) { var r = LIVE.mine[it.id]; if (r && r.ok) { LS.done++; return false; } return true; });
    next(); return;
  }
  if (t.mode === "one" && t.pos) {
    if (old.mode !== "one" || old.pos !== t.pos) return liveCard();
    var m = LIVE.marks[t.pos], a = LIVE.mine[t.pos], om = (old.mark || {})[t.pos];
    if (m && a && m.for === a.at && (!om || om.for !== m.for || om.ok !== m.ok)) liveResult(m.ok);
    return;
  }
  if (old.mode !== t.mode || !t.mode) liveWait();
}
function liveCard() {   // the card the teacher is on
  var k = cardAt(LIVE.ctl.pos); if (!k) return;
  var c = k.c, a = LIVE.mine[k.id] || null, m = LIVE.marks[k.id], h = "";
  LS = null; CUR_GET = null; bare(); liveCur(k.id);
  if (c.type === "teach") {
    h = '<h2>' + esc(c.title) + '</h2><div class="say"><div class="me">' + GLOW + '</div><div class="bub">' + c.text + '</div></div>';
    if (c.pic) h += '<div class="pic' + (TAPS[c.pic] ? " tap" : "") + '" id="pic">' + PICS[c.pic]() + '</div>' + (TAPS[c.pic] ? '<div class="tapme">Tap the picture</div>' : "");
    $("card").innerHTML = h; $("foot").classList.add("hidden");
    var pic = $("pic"); if (pic && TAPS[c.pic]) pic.onclick = function (ev) { TAPS[c.pic](pic, ev); };
    return;
  }
  if (a && m && m.for === a.at && m.ok) a.ok = true;
  if (a && a.ok) { $("card").innerHTML = waitHtml("You got this one! Wait for the next card."); $("foot").classList.add("hidden"); return; }
  if (a && !(m && m.for === a.at)) return liveSent(k, a.v);   // sent, teacher still checking
  h = '<div class="tag' + (c.boss ? " boss" : "") + '">' + (a ? "Try again" : c.boss ? "Boss question" : c.type === "order" ? "Put in order" : c.type === "match" ? "Match" : "Choose") + '</div><div class="q">' + esc(c.q) + '</div>';
  if (c.pic) h += '<div class="pic">' + PICS[c.pic]() + '</div>';
  $("card").innerHTML = h + '<div id="ans"></div>';
  var get = CUR_GET = ({ choice: renderChoice, order: renderOrder, match: renderMatch })[c.type](c, $("ans"));
  foot("", "", "Send to Teacher View", false);
  $("act").onclick = function () {
    var v = get(), prev = LIVE.mine[k.id], rec = { v: v, at: Date.now(), tries: (prev ? prev.tries : 0) + 1 };
    LIVE.mine[k.id] = rec; fbWrite("PUT", "live", "/" + AUTH.uid + "/a/" + k.id, rec); liveSent(k, v);
  };
}

  if (!$("ans")) $("card").innerHTML = '<div class="q">' + esc(k.c.q) + '</div><div class="keybox">' + pickHtml(k.c, v) + '</div>';
  foot("", '<span class="ic"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9" fill="none" stroke="#2F80C9" stroke-width="2.4"/><path d="M12 7v5l3 2" stroke="#2F80C9" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></span><div><h3 style="color:#2F80C9">Sent!</h3><p>Teacher View is checking your answer…</p></div>', "Waiting…", false);

/* ---------- show screen: controls the session and the phones; shows what she sent; the teacher marks it ---------- */
var ROOM = {}, BACK = {};
function students() { return Object.keys(ROOM).filter(function (u) { return ROOM[u] && ROOM[u].n; }); }
function liveTeacher() {
  document.body.classList.add("teach"); show("scrTeach");
  var list = allPos(), ST = { mode: "wait", li: 0, pos: list[0] };
  try { ST = JSON.parse(localStorage.getItem(CLS + "-ctl")) || ST; } catch (e) {}
  $("tsel").innerHTML = DATA.lessons.map(function (L, i) { return '<option value="' + i + '">Part ' + (i + 1) + ": " + esc(L.title) + '</option>'; }).join("");
  $("tsel").onchange = function () { ST.li = +this.value; ST.pos = this.value + "-0"; push(); };
  $("tprev").onclick = function () { var i = list.indexOf(ST.pos); if (i > 0) { ST.pos = list[i - 1]; ST.li = +ST.pos.split("-")[0]; push(); } };
  $("tnext").onclick = function () { var i = list.indexOf(ST.pos); if (i < list.length - 1) { ST.pos = list[i + 1]; ST.li = +ST.pos.split("-")[0]; push(); } };
  document.querySelectorAll("[data-mode]").forEach(function (b) { b.onclick = function () { ST.mode = b.getAttribute("data-mode"); push(); }; });
  document.addEventListener("keydown", function (e) { if (e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") $("tnext").click(); if (e.key === "ArrowLeft") $("tprev").click(); });
  inkSetup(); draw();
  token().then(function () {
    fbStream("live", "", function (t) { var before = students().join(); ROOM = t || {};
      students().forEach(function (u) { if (before.indexOf(u) < 0) fbWrite("PATCH", "back", "/" + u, ctl()); });   // a phone that joins late gets the session as it is
      answers(); });
    fbStream("back", "", function (t) { BACK = t || {}; answers(); });
    push();
  });
  function ctl() { return ST.mode === "part" ? { mode: "part", li: ST.li, pos: null } : ST.mode === "one" ? { mode: "one", pos: ST.pos, li: null } : { mode: "wait", pos: null, li: null }; }
  function push() {
    try { localStorage.setItem(CLS + "-ctl", JSON.stringify(ST)); } catch (e) {}
    draw();
    if (!AUTH) return;
    var c = ctl(), batch = {};
    students().forEach(function (u) { Object.keys(c).forEach(function (k) { batch[u + "/" + k] = c[k]; }); });
    if (Object.keys(batch).length) fbWrite("PATCH", "back", "", batch);
  }
  function draw() {
    var k = cardAt(ST.pos), L = DATA.lessons[k.li];
    $("tsel").value = k.li; $("tno").textContent = (k.ci + 1) + " / " + L.cards.length;
    document.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-mode") === ST.mode); });
    $("tmode").textContent = ST.mode === "part" ? "Phones: Part " + (ST.li + 1) + ", own pace" : ST.mode === "one" ? "Phones: this card" : "Phones: waiting";
    $("tcard").innerHTML = staticCard(k.c) + '<div id="tans"></div>'; inkClear();
    var pic = $("pic"); if (pic && TAPS[k.c.pic]) pic.onclick = function (ev) { if (!INK.on) TAPS[k.c.pic](pic, ev); };
    answers();
  }
  function answers() {   // under the card: what each student sent for it, with ถูก / ยังไม่ถูก
    var k = cardAt(ST.pos), box = $("tans"); if (!k || !box) return;
    var us = students();
    $("tdots").innerHTML = us.map(function (u) { var d = ROOM[u]; return '<span class="sd' + (d.cur === k.id ? " in" : "") + '">' + esc(d.n) + (d.cur === k.id ? " · on this card" : d.cur ? " · card " + d.cur.replace(/^(\d+)-(\d+)$/, function (_, a, b) { return (+a + 1) + "." + (+b + 1); }) : " · waiting") + '</span>'; }).join("") || '<span class="sd">' + (AUTH ? "no phones yet" : "connecting…") + '</span>';
    if (k.c.type === "teach") { box.innerHTML = ""; return; }
    box.innerHTML = us.map(function (u) {
      var d = ROOM[u], a = (d.a || {})[k.id], m = ((BACK[u] || {}).mark || {})[k.id], done = a && m && m.for === a.at;
      if (!a) return '<div class="tanswer"><b>' + esc(d.n) + '</b><span class="hint">' + (d.cur === k.id ? "thinking…" : "not sent yet") + '</span></div>';
      var res = a.auto ? (a.ok ? "right" + (a.tries > 1 ? " (try " + a.tries + ")" : "") : "not yet") : done ? (m.ok ? "marked right" : "marked not yet") : "";
      return '<div class="tanswer' + (done || a.auto ? (a.ok || (done && m.ok) ? " ok" : " no") : "") + '"><b>' + esc(d.n) + '</b><div class="tv">' + pickHtml(k.c, a.v) + '</div>' +
        (a.auto ? '<span class="tres">' + res + '</span>' : '<span class="tbtn"><button data-u="' + u + '" data-ok="1"' + (done && m.ok ? ' class="on"' : "") + '>ถูก</button><button data-u="' + u + '" data-ok="0"' + (done && !m.ok ? ' class="on"' : "") + '>ยังไม่ถูก</button></span>') + '</div>';
    }).join("");
    box.querySelectorAll("[data-ok]").forEach(function (b) { b.onclick = function () {
      var u = b.getAttribute("data-u"), a = ((ROOM[u] || {}).a || {})[k.id]; if (!a) return;
      fbWrite("PUT", "back", "/" + u + "/mark/" + k.id, { ok: b.getAttribute("data-ok") === "1", for: a.at });
    }; });
    if (INK.size) INK.size();
  }
}
/* pen on the show screen: Apple Pencil / mouse draws; a finger still taps the pictures and buttons */
var INK = { on: false, er: false, cv: null, cx: null, col: "#C62828", pen: false };
function inkSetup() {
  var cv = INK.cv = $("ink"), cx = INK.cx = cv.getContext("2d"), down = false;
  function size() { var r = $("tstage").getBoundingClientRect(), d = window.devicePixelRatio || 1, h = Math.max(r.height, $("tcard").scrollHeight + 40);
    if (Math.abs(cv.height - h * d) < 2 && cv.width === Math.round(r.width * d)) return;
    var img = null; try { img = cx.getImageData(0, 0, cv.width, cv.height); } catch (e) {}
    cv.width = r.width * d; cv.height = h * d; cv.style.height = h + "px"; cx.setTransform(d, 0, 0, d, 0, 0); if (img) cx.putImageData(img, 0, 0); }
  INK.size = size; window.addEventListener("resize", size); setTimeout(size, 50);
  function pt(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener("pointerdown", function (e) { if (e.pointerType === "pen") INK.pen = true; if (e.pointerType === "touch" && INK.pen) return;
    down = true; cv.setPointerCapture(e.pointerId); var p = pt(e); cx.beginPath(); cx.moveTo(p[0], p[1]); });
  cv.addEventListener("pointermove", function (e) { if (!down) return; var p = pt(e);
    cx.globalCompositeOperation = INK.er ? "destination-out" : "source-over"; cx.strokeStyle = INK.col; cx.lineWidth = INK.er ? 26 : 3.5; cx.lineCap = cx.lineJoin = "round"; cx.lineTo(p[0], p[1]); cx.stroke(); });
  cv.addEventListener("pointerup", function () { down = false; });
  $("tpen").onclick = function () { INK.on = !(INK.on && !INK.er); INK.er = false; tools(); };
  $("ter").onclick = function () { INK.on = true; INK.er = !INK.er; tools(); };
  $("tclr").onclick = inkClear;
  document.querySelectorAll(".sw").forEach(function (b) { b.onclick = function () { INK.col = b.getAttribute("data-c"); INK.on = true; INK.er = false; tools(); }; });
  function tools() { cv.style.pointerEvents = INK.on ? "auto" : "none"; $("tpen").classList.toggle("on", INK.on && !INK.er); $("ter").classList.toggle("on", INK.on && INK.er);
    document.querySelectorAll(".sw").forEach(function (b) { b.classList.toggle("on", INK.on && !INK.er && b.getAttribute("data-c") === INK.col); }); }
  tools();
}
function inkClear() { if (INK.cx) { INK.cx.clearRect(0, 0, INK.cv.width, INK.cv.height); if (INK.size) setTimeout(INK.size, 30); } }

/* ---------- hidden screen: the answer book, paged by the teacher ---------- */
function openKey(pw) {
  var p = DATA.key.split(".");
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"])
    .then(function (k) { return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(p[0]), iterations: 150000, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); })
    .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p[1]) }, k, b64(p[2])); })
    .then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
}
function liveWatch() {
  document.body.classList.add("watch"); show("scrWatch");
  var list = allPos(), KEYS = null, pos = list[0];
  try { pos = localStorage.getItem(CLS + "-book") || pos; } catch (e) {}
  $("wsel").innerHTML = DATA.lessons.map(function (L, i) { return '<option value="' + i + '">Part ' + (i + 1) + ": " + esc(L.title) + '</option>'; }).join("");
  $("wsel").onchange = function () { go(this.value + "-0"); };
  $("wprev").onclick = function () { var i = list.indexOf(pos); if (i > 0) go(list[i - 1]); };
  $("wnext").onclick = function () { var i = list.indexOf(pos); if (i < list.length - 1) go(list[i + 1]); };
  document.addEventListener("keydown", function (e) { if (e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") $("wnext").click(); if (e.key === "ArrowLeft") $("wprev").click(); });
  var x0 = null; $("wbody").addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  $("wbody").addEventListener("touchend", function (e) { if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (dx < -70) $("wnext").click(); if (dx > 70) $("wprev").click(); });
  function go(p) { pos = p; try { localStorage.setItem(CLS + "-book", p); } catch (e) {} render(); window.scrollTo(0, 0); }
  function render() {
    var k = cardAt(pos), c = k.c, L = DATA.lessons[k.li], K = KEYS && KEYS[pos];
    $("wsel").value = k.li; $("wno").textContent = (k.ci + 1) + " / " + L.cards.length;
    var h = '<div class="wpage">' + staticCard(c, K ? K.k : null) + '</div>';
    if (c.type === "teach") h += '<div class="wwhy"><b>การ์ดสอน</b>' + (c.tap ? "<p>แตะรูปแล้วจะขึ้น: " + esc(c.tap) + "</p>" : "<p>ไม่มีคำถาม อ่านกับน้องแล้วไปต่อ</p>") + '</div>';
    else if (!KEYS) h += '<div class="wwhy"><button class="btn ghost" id="wkey2">ใส่รหัสเฉลย</button></div>';
    else h += '<div class="wwhy"><b>ทำไมตอบแบบนี้</b><p>' + esc(K.why) + '</p><b>ถ้าน้องยังไม่ถูก ใบ้ว่า</b><p>' + esc(c.hint) + '</p><div class="hint">เรื่อง: ' + esc(c.tag) + '</div></div>';
    $("wbody").innerHTML = h;
    var pic = $("pic"); if (pic && TAPS[c.pic]) pic.onclick = function (ev) { TAPS[c.pic](pic, ev); };
    var b = $("wkey2"); if (b) b.onclick = askKey;
  }
  function askKey() {
    var saved = ""; try { saved = localStorage.getItem(CLS + "-keypw") || ""; } catch (e) {}
    var pw = saved || prompt("รหัสเฉลย (อยู่ในไฟล์ KEY-PASSWORD.txt ของโปรเจกต์)");
    if (!pw) return;
    openKey(pw.trim()).then(function (k) { KEYS = k; try { localStorage.setItem(CLS + "-keypw", pw.trim()); } catch (e) {} render(); },
      function () { try { localStorage.removeItem(CLS + "-keypw"); } catch (e) {} if (saved) askKey(); else alert("รหัสเฉลยไม่ถูก"); });
  }
  render(); askKey();
}

load();
document.title = DATA.title;
if (MODE === "live") liveStudent();
else if (MODE === "teach") liveTeacher();
else if (MODE === "watch") liveWatch();
else if (S.name) pathScreen(); else nameScreen();
</script>
