<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Light Explorer · Mission 2</title>
<!-- generated by tools/build-light-p5.py from tools/light-p5-shell.html; edit those, not this file -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@300..700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1d2230; --ink: #1f2937; --bar: #ffffff; --barline: #e5e7eb; --on: #111827; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; font-family: 'Sarabun', system-ui, sans-serif; }

  /* toolbar (same as /demo/) */
  #bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); background: var(--bar); border-bottom: 1px solid var(--barline); user-select: none; -webkit-user-select: none; }
  #bar .grp { display: flex; align-items: center; gap: 4px; }
  #bar .sep { width: 1px; height: 26px; background: var(--barline); margin: 0 4px; }
  #pageNo { font-size: 15px; min-width: 3.6em; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); }
  #bar button { font: inherit; font-size: 15px; border: 1px solid var(--barline); background: #fff; color: var(--ink); border-radius: 10px; min-height: 38px; min-width: 38px; padding: 0 10px; cursor: pointer; touch-action: manipulation; }
  #bar button:disabled { opacity: .35; }
  #bar button.on { background: var(--on); color: #fff; border-color: var(--on); }
  #bar button.sw { width: 34px; min-width: 34px; padding: 0; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--barline); }
  #bar button.sw.on { box-shadow: 0 0 0 3px var(--on); }
  #bar button.size { display: flex; align-items: center; justify-content: center; padding: 0; width: 38px; }
  #bar button.size i { display: block; background: currentColor; border-radius: 50%; }
  /* phones: icons only and smaller buttons, so the toolbar takes two rows instead of four */
  @media (max-width: 600px), (max-height: 500px) {
    #bar { gap: 3px; padding: 4px 6px; padding-top: max(4px, env(safe-area-inset-top)); }
    #bar .sep { display: none; }
    #bar .grp { gap: 3px; }
    #bar .lbl { display: none; }
    #bar button { min-height: 32px; min-width: 32px; padding: 0 6px; font-size: 14px; border-radius: 8px; }
    #bar button.sw { width: 26px; min-width: 26px; }
    #bar button.size { width: 30px; }
    #pageNo { min-width: 3.2em; font-size: 14px; }
  }

  /* one worksheet page at a time, scaled to the screen width; it scrolls up/down if taller than the screen.
     touch-action none: a resting palm can't drag the page while writing (finger panning is done in JS) */
  #stage { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; touch-action: none; -webkit-overflow-scrolling: touch; }
  body.hand #stage { touch-action: pan-y; }
  .sheet { display: none; position: relative; margin: 8px auto; overflow: hidden; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.35); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .sheet.cur { display: block; }
  .sheet .page { transform-origin: 0 0; }
  .ink { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; touch-action: none; cursor: crosshair; }
  body.erasing .ink { cursor: cell; }
  body.hand .ink { pointer-events: none; }

/*SHEET_CSS*/
</style>
</head>
<body>
<div id="bar">
  <div class="grp">
    <button id="mPen" class="on" title="ปากกา (แตะสั้นๆ บนรูปเพื่อเล่นอนิเมชั่น)">✏️<span class="lbl"> เขียน</span></button>
    <button id="mErase" title="ยางลบ">🧽<span class="lbl"> ลบ</span></button>
    <button id="mHand" title="แตะรูปและเลื่อนหน้า ไม่เขียน">👆<span class="lbl"> แตะ</span></button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="colors"></div>
  <div class="sep"></div>
  <div class="grp" id="sizes"></div>
  <div class="sep"></div>
  <div class="grp">
    <button id="palm" title="เปิด: เขียนได้เฉพาะ Apple Pencil นิ้วใช้แตะและเลื่อนหน้า · ปิด: ปากกาทั่วไปหรือนิ้วก็เขียนได้ (กันฝ่ามือจากขนาดการแตะ)">🖐<span class="lbl"> กันมือ</span></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="undo" title="ย้อนกลับ">↶</button>
    <button id="clear" title="ลบทั้งหมดในหน้านี้">🗑<span class="lbl"> ล้าง</span></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="prev" title="หน้าก่อนหน้า">◀</button>
    <span id="pageNo">1 / 14</span>
    <button id="next" title="หน้าถัดไป">▶</button>
    <button id="full" title="เต็มจอ">⛶</button>
  </div>
</div>
<div id="stage">
<!--PAGES-->
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const sheets = [...document.querySelectorAll('.sheet')];
  let cur = 0, dpr = 1;

  // ================= tap animations =================
  // play(): add .play so the CSS animation runs once, then take it off again
  function play(el, ms) {
    el.classList.remove('play');
    void el.getBoundingClientRect();
    el.classList.add('play');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('play'), ms);
  }
  function confetti(box, color) {
    const cols = [color, '#FFD23F', '#2F80C9', '#E8962E', '#C2557A'];
    for (let i = 0; i < 16; i++) {
      const c = document.createElement('i');
      const a = Math.PI * 2 * i / 16 + Math.random() * .3, d = 50 + Math.random() * 40;
      c.className = 'confetti';
      c.style.background = cols[i % cols.length];
      c.style.setProperty('--dx', `calc(-50% + ${Math.cos(a) * d}px)`);
      c.style.setProperty('--dy', `calc(-50% + ${Math.sin(a) * d}px)`);
      box.appendChild(c);
      setTimeout(() => c.remove(), 1000);
    }
  }
  // page 9 demo: the Sun goes from low on the left, over the top, to low on the right
  function sunDay(btn, t) {
    const svg = btn.nextElementSibling, sun = svg.querySelector('.dsun'), sh = svg.querySelector('.dshade');
    const a = Math.PI - 0.3 - t * (Math.PI - 0.6);
    const sx = 180 + 150 * Math.cos(a), sy = 100 - 74 * Math.sin(a);
    sun.setAttribute('transform', `translate(${sx.toFixed(1)} ${sy.toFixed(1)})`);
    const elev = Math.atan2(100 - sy, Math.abs(sx - 180));
    const L = Math.max(8, Math.min(150, 58 / Math.tan(elev)));
    sh.setAttribute('cx', (180 + (sx < 180 ? 1 : -1) * L / 2).toFixed(1));
    sh.setAttribute('rx', (L / 2).toFixed(1));
  }
  // shine a light source on an object (geometry in data-cast / data-obs, see cast_svg in the build script):
  // the light spreads out from the source, the area between the two edge rays behind the object stays
  // dark, and the shadow forms where those rays meet the ground or the wall. on: true/false, or toggle.
  // now: draw it straight away (while the lamp is being dragged)
  let castN = 0;
  function cast(svg, on, now) {
    const box = svg.querySelector('.cast');
    if (on === undefined) on = !box.hasChildNodes();
    cancelAnimationFrame(box._raf);
    box.innerHTML = '';
    if (!on) return;
    const vb = svg.viewBox.baseVal, geo = JSON.parse(svg.dataset.cast);
    const [sx, sy] = geo.s, W = geo.wall ?? vb.width, H = geo.g ?? vb.height;
    const pts = svg.dataset.obs.split(' ').map(q => q.split(',').map(Number));
    const mx = pts.reduce((a, p) => a + p[0], 0) / pts.length, my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    const base = Math.atan2(my - sy, mx - sx);
    let lo = Infinity, hi = -Infinity, P1, P2;
    for (const p of pts) {
      let d = Math.atan2(p[1] - sy, p[0] - sx) - base;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      if (d < lo) { lo = d; P1 = p; }
      if (d > hi) { hi = d; P2 = p; }
    }
    const a1 = base + lo, a2 = base + hi;
    // where an edge ray leaves the lit area (ground, wall or picture edge)
    const exit = a => {
      const ux = Math.cos(a), uy = Math.sin(a);
      let t = Infinity;
      if (ux > 1e-6) t = Math.min(t, (W - sx) / ux); else if (ux < -1e-6) t = Math.min(t, -sx / ux);
      if (uy > 1e-6) t = Math.min(t, (H - sy) / uy); else if (uy < -1e-6) t = Math.min(t, -sy / uy);
      return [sx + ux * t, sy + uy * t];
    };
    const E1 = exit(a1), E2 = exit(a2), F = 3000;
    const far = (P, a) => `${P[0] + Math.cos(a) * F},${P[1] + Math.sin(a) * F}`;
    // the shadow: where the dark area meets the ground (or wall); a ray that misses it runs the shadow to the edge
    let shade;
    if (geo.g != null) {
      const xs = [[E1, a1], [E2, a2]].map(([E, a]) => Math.abs(E[1] - H) < .5 ? E[0] : (Math.cos(a) > 0 ? vb.width : 0));
      for (const p of pts) if (p[1] >= H - .5) xs.push(p[0]);
      const x1 = Math.max(6, Math.min(...xs)), x2 = Math.min(vb.width - 6, Math.max(...xs));
      shade = `<ellipse class="shade" cx="${(x1 + x2) / 2}" cy="${H + 2}" rx="${(x2 - x1) / 2}" ry="5"/>`;
    } else {
      const ys = [[E1, a1], [E2, a2]].map(([E, a]) => Math.abs(E[0] - W) < .5 ? E[1] : (Math.sin(a) > 0 ? vb.height : 0));
      const y1 = Math.max(6, Math.min(...ys)), y2 = Math.min(vb.height - 6, Math.max(...ys));
      shade = `<ellipse class="shade" cx="${W - 4}" cy="${(y1 + y2) / 2}" rx="6" ry="${(y2 - y1) / 2}"/>`;
    }
    const id = 'cast' + (++castN);
    box.innerHTML = `<defs><clipPath id="${id}c"><circle cx="${sx}" cy="${sy}" r="0"/></clipPath>
      <mask id="${id}m" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#fff"/>
      <polygon points="${P1} ${far(P1, a1)} ${far(P2, a2)} ${P2}" fill="#000"/></mask></defs>
      <g clip-path="url(#${id}c)"><rect class="lit" width="${W}" height="${H}" mask="url(#${id}m)"/>
      <path class="edge" d="M${sx} ${sy} L${E1} M${sx} ${sy} L${E2}"/></g>${shade}`;
    if (now) { box.querySelector('circle').setAttribute('r', 9999); box.querySelector('.shade').classList.add('on'); return; }
    const circle = box.querySelector('circle'), R = Math.hypot(Math.max(sx, W - sx), Math.max(sy, H - sy)), t0 = performance.now();
    const grow = now => {
      const t = Math.min(1, (now - t0) / 1000);
      circle.setAttribute('r', (R * t).toFixed(1));
      if (t < 1) box._raf = requestAnimationFrame(grow); else box.querySelector('.shade').classList.add('on');
    };
    box._raf = requestAnimationFrame(grow);
  }
  const ACT = {
    glow: el => play(el, 900),
    badge: el => { if (el.classList.toggle('on')) play(el, 600); },
    win: el => { if (el.classList.toggle('on')) { play(el, 600); confetti(el.parentNode, el.style.getPropertyValue('--c')); } },
    pill: el => el.classList.toggle('ring'),
    beams: el => play(el.ownerSVGElement, 2200),
    flash: el => play(el, 800),
    strawA: el => { play(el, 800); play(el.ownerSVGElement.querySelector('.lightA'), 2200); },
    strawB: el => { play(el, 800); play(el.ownerSVGElement.querySelector('.lightB'), 2200); },
    // page 6: the first tap shines the light; after that the lamp switches off and on
    switch: el => {
      const svg = el.ownerSVGElement;
      if (!svg.classList.contains('casting')) { svg.classList.add('casting'); play(el, 800); cast(svg, true); return; }
      cast(svg, !svg.classList.toggle('off'));
    },
    cast: el => { play(el, 800); cast(el.ownerSVGElement); },
    wiggle: el => play(el, 600),
    moon: el => { el.classList.remove('asked'); void el.getBoundingClientRect(); el.classList.add('asked'); play(el, 2400); },
    sunday: btn => {
      if (btn.disabled) return;
      btn.disabled = true;
      const t0 = performance.now(), D = 5000;
      const step = now => {
        const t = Math.min(1, (now - t0) / D);
        sunDay(btn, t);
        if (t < 1) requestAnimationFrame(step); else btn.disabled = false;
      };
      requestAnimationFrame(step);
    },
  };
  function act(el) { const f = ACT[el.dataset.act]; if (f) f(el); }
  document.querySelectorAll('[data-act=sunday]').forEach(b => sunDay(b, 0));

  // page 10: drag the lamp in picture B; the shadow on the wall follows (similar triangles)
  let drag = null;
  function startDrag(g, e) { drag = { g, id: e.pointerId }; pan = null; moveDrag(e); }
  function moveDrag(e) {
    const g = drag.g, svg = g.ownerSVGElement, p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    const lx = Math.max(20, Math.min(150, p.matrixTransform(svg.getScreenCTM().inverse()).x));
    g.setAttribute('transform', `translate(${(lx - g.dataset.lx).toFixed(1)} 0)`);
    svg.querySelector('.wshade').setAttribute('ry', (16 * (300 - lx) / (190 - lx)).toFixed(1));
    // the lamp shines while it is held and moved
    const geo = JSON.parse(svg.dataset.cast);
    geo.s[0] = lx;
    svg.dataset.cast = JSON.stringify(geo);
    svg.classList.add('casting');
    cast(svg, true, true);
  }
  window.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id) { e.preventDefault(); moveDrag(e); } });
  const dragEnd = e => { if (drag && e.pointerId === drag.id) drag = null; };
  window.addEventListener('pointerup', dragEnd);
  window.addEventListener('pointercancel', dragEnd);

  // 👆 mode: the pen layer is off, so taps and drags reach the page directly
  document.addEventListener('click', e => { const t = e.target.closest('.tap'); if (t && mode === 'hand') act(t); });
  stage.addEventListener('pointerdown', e => { const d = e.target.closest('.drag'); if (d && mode === 'hand') { e.preventDefault(); startDrag(d, e); } });

  // ================= pen layers (one per page), as in /demo/ =================
  const COLORS = ['#111827', '#dc2626', '#2563eb', '#16a34a', '#f59e0b', '#9333ea'];
  const SIZES = [1, 2, 4];
  let mode = 'pen', color = COLORS[0], size = 2, penSeen = false, penDown = 0, penUpAt = 0;
  // Palm rejection: in "pencil only" (penSeen, turned on by itself the first time an Apple Pencil touches)
  // fingers never draw, they tap and scroll; otherwise big contacts (palm) are ignored and a stroke a
  // resting palm started is dropped when the pen lands.
  try { penSeen = localStorage.getItem('scitem-pen') === '1'; } catch (e) {}
  function setPencilOnly(on) {
    penSeen = on;
    $('palm').classList.toggle('on', on);
    try { localStorage.setItem('scitem-pen', on ? '1' : '0'); } catch (e) {}
  }
  function markPen() { if (!penSeen) setPencilOnly(true); }
  const PALM = 36;   // CSS px; contact wider than this is a palm (when the browser reports contact size)
  const contact = e => { const w = Math.max(e.width || 0, e.height || 0); return w > 1 ? w : 0; };
  const TAP_MS = 400, TAP_PX = 10;   // a pen/finger touch this short and still is a tap on the picture, not ink
  function makeInk(canvas) {
    const ictx = canvas.getContext('2d');
    const strokes = [];          // {color, size, erase, pts:[[x,y,p],...]} in 0..1 page coords
    let cur = null, pend = null;
    function lw(s) { return s.size * canvas.width / 400 * (s.erase ? 6 : 1); }
    function draw(s, from) {
      const pts = s.pts, w = canvas.width, h = canvas.height;
      ictx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
      ictx.strokeStyle = ictx.fillStyle = s.color;
      ictx.lineCap = ictx.lineJoin = 'round';
      const base = lw(s);
      if (pts.length === 1) { ictx.beginPath(); ictx.arc(pts[0][0] * w, pts[0][1] * h, base / 2, 0, 7); ictx.fill(); return; }
      for (let i = Math.max(1, from || 1); i < pts.length; i++) {
        const p0 = pts[i - 1], p1 = pts[i];
        ictx.lineWidth = s.erase ? base : base * (0.6 + 0.8 * p1[2]);
        ictx.beginPath(); ictx.moveTo(p0[0] * w, p0[1] * h); ictx.lineTo(p1[0] * w, p1[1] * h); ictx.stroke();
      }
    }
    function redraw() {
      ictx.globalCompositeOperation = 'source-over';
      ictx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of strokes) draw(s);
    }
    function pt(e) {
      const r = canvas.getBoundingClientRect();
      const p = e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5;
      return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, p];
    }
    function drop(s) { const i = strokes.indexOf(s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    function travel(s) {
      const r = canvas.getBoundingClientRect(), a = s.pts[0];
      return Math.max(...s.pts.map(q => Math.hypot((q[0] - a[0]) * r.width, (q[1] - a[1]) * r.height)));
    }
    // what is on the page under the pen layer at this point
    function under(e) {
      canvas.style.pointerEvents = 'none';
      const el = document.elementFromPoint(e.clientX, e.clientY);
      canvas.style.pointerEvents = '';
      return el;
    }
    canvas.addEventListener('pointerdown', e => {
      const big = e.pointerType === 'touch' && contact(e) > PALM;
      const hit = big ? null : under(e);
      const dragEl = hit && hit.closest('.drag'), tapEl = hit && hit.closest('.tap');
      if (dragEl && !cur && !(e.pointerType === 'touch' && penDown)) { e.preventDefault(); startDrag(dragEl, e); return; }
      if (e.pointerType === 'pen') {
        markPen();
        if (cur) { if (cur.touch) drop(cur); cur = null; }
      } else if (e.pointerType === 'touch') {
        if (penSeen) {                             // pencil-only: a finger can still tap a picture
          if (tapEl && !penDown) pend = { id: e.pointerId, el: tapEl, x: e.clientX, y: e.clientY, t: performance.now() };
          return;
        }
        if (big) return;
        if (cur && cur.touch) {
          if (contact(e) && cur.w && contact(e) > cur.w * 1.5) return;
          if ((contact(e) && cur.w ? cur.w >= contact(e) : travel(cur) < 40)) drop(cur);
          cur = null;
        }
      }
      if (cur) return;
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      cur = { id: e.pointerId, touch: e.pointerType === 'touch', w: contact(e), color, size, erase: mode === 'erase', pts: [pt(e)], tapEl, t: performance.now() };
      strokes.push(cur);
      draw(cur);
    });
    canvas.addEventListener('pointermove', e => {
      if (!cur || e.pointerId !== cur.id) return;
      e.preventDefault();
      let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      if (!evs.length) evs = [e];
      const start = cur.pts.length;
      for (const ce of evs) cur.pts.push(pt(ce));
      draw(cur, start);
    });
    const end = e => {
      if (pend && e.pointerId === pend.id) {
        if (e.type === 'pointerup' && performance.now() - pend.t < TAP_MS && Math.hypot(e.clientX - pend.x, e.clientY - pend.y) < TAP_PX) act(pend.el);
        pend = null;
      }
      if (!cur || e.pointerId !== cur.id) return;
      if (e.type === 'pointerup' && cur.tapEl && performance.now() - cur.t < TAP_MS && travel(cur) < TAP_PX) { drop(cur); act(cur.tapEl); }
      delete cur.touch; delete cur.w; delete cur.tapEl;
      cur = null;
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    return {
      canvas, redraw,
      undo() { strokes.pop(); redraw(); },
      clear() { strokes.length = 0; redraw(); },
    };
  }
  const inks = sheets.map(s => makeInk(s.querySelector('.ink')));

  // ================= layout & paging =================
  function layout() {
    const sheet = sheets[cur], page = sheet.querySelector('.page');
    const k = Math.min(stage.clientWidth - 16, 900) / page.offsetWidth;
    page.style.transform = `scale(${k})`;
    sheet.style.width = Math.floor(page.offsetWidth * k) + 'px';
    sheet.style.height = Math.floor(page.offsetHeight * k) + 'px';
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const c = inks[cur].canvas, r = c.getBoundingClientRect();
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    inks[cur].redraw();
  }
  function go(i) {
    i = Math.max(0, Math.min(sheets.length - 1, i));
    sheets[cur].classList.remove('cur');
    cur = i;
    sheets[cur].classList.add('cur');
    layout();
    stage.scrollTop = 0;
    $('pageNo').textContent = (cur + 1) + ' / ' + sheets.length;
    $('prev').disabled = cur === 0; $('next').disabled = cur === sheets.length - 1;
    history.replaceState(null, '', '#p' + (cur + 1));
  }

  // ================= palm-safe finger panning on the stage =================
  // Native touch scrolling is off (#stage touch-action: none) so a resting palm can't drag the page.
  // A single finger that isn't drawing scrolls the page; a quick sideways swipe turns the page.
  // Ignored while the pen is down or was just lifted, for palm-sized contacts, and with two touches.
  const touches = new Set();
  let pan = null;
  stage.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') { penDown++; pan = null; return; }
    if (e.pointerType !== 'touch' || mode === 'hand') return;
    touches.add(e.pointerId);
    const drawing = !penSeen && e.target.classList.contains('ink');
    const busy = penDown || performance.now() - penUpAt < 800;
    pan = touches.size === 1 && !drawing && !busy && contact(e) <= PALM
      ? { id: e.pointerId, x: e.clientX, y: e.clientY, top: stage.scrollTop, t: performance.now() } : null;
  }, true);
  window.addEventListener('pointermove', e => {
    if (pan && e.pointerId === pan.id && !drag) stage.scrollTop = pan.top - (e.clientY - pan.y);
  }, true);
  const touchEnd = e => {
    if (e.pointerType === 'pen') { penDown = Math.max(0, penDown - 1); penUpAt = performance.now(); return; }
    touches.delete(e.pointerId);
    if (!pan || e.pointerId !== pan.id) return;
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y, dt = performance.now() - pan.t;
    pan = null;
    if (e.type === 'pointerup' && dt < 700 && Math.abs(dx) > Math.max(60, stage.clientWidth * 0.15) && Math.abs(dx) > 2 * Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
  };
  window.addEventListener('pointerup', touchEnd, true);
  window.addEventListener('pointercancel', touchEnd, true);
  // older iPadOS ignores touch-action in places; also stops the long-press magnifier and double-tap zoom
  stage.addEventListener('touchstart', e => {
    if ([...e.changedTouches].some(t => t.touchType === 'stylus')) { markPen(); return; }
    if (mode !== 'hand') e.preventDefault();
  }, { passive: false });

  $('prev').onclick = () => go(cur - 1);
  $('next').onclick = () => go(cur + 1);

  // ================= toolbar =================
  const modeBtns = { pen: $('mPen'), erase: $('mErase'), hand: $('mHand') };
  function setMode(m) {
    mode = m;
    for (const k in modeBtns) modeBtns[k].classList.toggle('on', k === m);
    document.body.classList.toggle('erasing', m === 'erase');
    document.body.classList.toggle('hand', m === 'hand');
  }
  for (const k in modeBtns) modeBtns[k].onclick = () => setMode(k);
  const cwrap = $('colors');
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'sw' + (i === 0 ? ' on' : '');
    b.style.background = c; b.title = 'สี';
    b.onclick = () => { color = c; [...cwrap.children].forEach(x => x.classList.toggle('on', x === b)); setMode('pen'); };
    cwrap.appendChild(b);
  });
  const swrap = $('sizes');
  SIZES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'size' + (s === size ? ' on' : '');
    const d = 4 + s * 3; b.innerHTML = `<i style="width:${d}px;height:${d}px"></i>`;
    b.title = 'ขนาดเส้น';
    b.onclick = () => { size = s; [...swrap.children].forEach(x => x.classList.toggle('on', x === b)); if (mode !== 'pen') setMode('pen'); };
    swrap.appendChild(b);
  });
  $('palm').onclick = () => setPencilOnly(!penSeen);
  $('palm').classList.toggle('on', penSeen);
  $('undo').onclick = () => inks[cur].undo();
  $('clear').onclick = () => inks[cur].clear();
  $('full').onclick = () => {
    const d = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  };
  if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) $('full').style.display = 'none';
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); $('undo').click(); }
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); stage.scrollTop += e.key === 'ArrowDown' ? 80 : -80; }
  });

  window.addEventListener('resize', layout);
  go((parseInt(location.hash.slice(2), 10) || 1) - 1);
  if (document.fonts) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
