<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ความร้อนรวบยอด & สมบัติของสาร</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Sarabun:wght@400;600&display=swap">
<style>
/* Built by tools/build-sheet-class.mjs from tools/sheet-class-shell.html — edit those, not the built page.
   A worksheet as a live class. One page, three screens:
   student (default): the student sheet page by page, write with the pencil, "Send to teacher";
   #show: the teacher's screen to share on the call — same pages, no answers, the teacher writes, can bring up the student's sent work;
   #teacher (retired, opens #show): was hidden — what the student sent, the answer key under it, red pen for marking (not shown to the student), save as PDF;
   #live: the teacher's hidden screen — every student's page and ink as she writes (Firebase, CFG.fb), tap one to see it big with the key. */
:root{
  --bg:#f8f3ea; --card:#fff; --fg:#1f2836; --muted:#5d6676; --line:#ddd4c6;
  --navy:#2b3a55; --peach:#db9e89; --sage:#729783; --mint:#e9f2eb; --good:#2f7a4f; --bad:#b03a2e; --red:#d62828; --blue:#1f5fa8;
  --display:"Poppins","Sarabun",system-ui,sans-serif; --body:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
button,select{font:600 15px var(--display);color:var(--fg);cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg);z-index:50}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
#gate h1{font:700 1.5rem var(--display);margin:0}
#gate label{font:600 15px var(--display);display:flex;flex-direction:column;gap:6px}
#gate input{font:600 20px var(--display);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);-webkit-user-select:text;user-select:text}
#gate .err{color:var(--bad);min-height:1.4em;font-weight:600}
.big{font:700 1.15rem var(--display);min-height:56px;padding:0 24px;border-radius:14px;border:none;background:var(--navy);color:#fff}
.big:disabled{opacity:.45}

/* ---------- app ---------- */
#app{height:100dvh;display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:8px}
#bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#bar h1{font:700 1.05rem var(--display);margin:0 4px 0 0;white-space:nowrap}
#who{color:var(--muted);font-weight:600}
.sp{flex:1}
.b{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.b[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sw{width:22px;height:22px;border-radius:50%;display:inline-block;vertical-align:middle}
#send{background:var(--sage);color:#fff;border-color:var(--sage);min-width:150px}
#send.done{background:var(--mint);color:var(--good);border-color:var(--mint)}
#net{color:var(--bad);font-weight:600;font-size:14px}
#status{color:var(--good);font-weight:600;font-size:14px;min-width:4em}
#nav{display:flex;align-items:center;gap:5px}
#nav .arr{min-width:52px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
#dots{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:4px 2px}   /* one row, slides sideways on long sheets */
#dots::-webkit-scrollbar{display:none}
#dots button{flex:none}
#dots button{min-width:38px;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:600 13px var(--display);position:relative;padding:0 3px}
#dots button[aria-current="true"]{outline:3px solid var(--navy);outline-offset:-3px}
#dots button.sent{background:var(--mint)}
#dots button.new::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#e07a1f;border:2px solid #fff}
#stu{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 8px}
#note{font-size:14px;color:var(--muted);font-weight:600}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.b.i{display:inline-flex;align-items:center;justify-content:center;gap:6px}
#tPen .sw{width:12px;height:12px;margin-left:-2px}
#colors{display:inline-flex;gap:4px;align-items:center;padding:0 2px}
#colors button{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
#colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
#nav .arr{display:inline-flex;align-items:center;justify-content:center}
#work,#fWork{flex:1;min-height:0;display:flex;gap:8px}
#work #scroll,#fWork #fScroll{flex:1;min-width:0}
/* answer boxes: one card per question on this page */
#ans{width:min(330px,34vw);overflow:auto;display:flex;flex-direction:column;gap:8px;-webkit-user-select:text;user-select:text}
#ans .sym{display:flex;gap:4px;flex-wrap:wrap}
#ans .sym button{min-width:40px;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:600 17px var(--body)}
.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px}
.qa h3{font:700 15px var(--display);margin:0}
.qa .pt{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted);font-weight:600}
.qa .row{display:flex;gap:5px}
.qa input,.qa select{font:600 17px var(--body);min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 8px;min-width:0;color:var(--fg)}
.qa input.num{flex:1.6}.qa input.unit{flex:1}
.qa select{width:100%}
.qa .go{min-height:44px;border-radius:10px;border:none;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.qa .go:disabled{background:var(--line);color:var(--muted)}
.qa .st{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:flex-start;gap:6px}
.qa .st .ic{width:18px;height:18px}
.qa.ok{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}.qa.ok .st{color:var(--good)}
.qa.no{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}.qa.no .st{color:var(--bad)}
.qa .sol{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:var(--blue)}
.qa .sol img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}
#toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:var(--blue);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;
  display:flex;align-items:center;gap:10px;font:600 16px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
#toast button{min-height:40px;border-radius:10px;border:none;background:#fff;color:var(--blue);padding:0 14px}
#zoomSol{position:fixed;inset:0;z-index:40;background:rgba(20,24,32,.75);display:grid;place-items:center;padding:16px}
#zoomSol img{max-width:min(100%,1000px);max-height:100%;background:#fff;border-radius:10px}
.rq .pub{min-height:38px;border-radius:10px;border:1px dashed var(--blue);background:var(--card);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.rq .pub.on{background:var(--blue);color:#fff;border-style:solid}
.qa .hint{color:var(--fg);font-weight:600;background:var(--bg);border-radius:8px;padding:6px 8px;white-space:pre-wrap}
#note.red{color:var(--red)}

#scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px;background:#e9e3d8;touch-action:pan-x pan-y} /* two fingers zoom the sheet, not the whole page */
#page{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15)}
#page img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
#page canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#page canvas.ink{pointer-events:auto;touch-action:none}
body.scrolly #page canvas.ink{touch-action:pan-x pan-y}
#pages{padding:8px}
#page{margin:0;flex:none}
#keyTag{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font:700 13px var(--display);border-radius:999px;padding:2px 10px}

/* ---------- screens ---------- */
body.show #bar h1::after{content:" · จอครู (แชร์ได้)";color:var(--blue)}
body.teacher #bar h1::after{content:" · จอครู (ซ่อน)";color:var(--red)}

/* ---------- #live: every student at once ---------- */
#live{height:100dvh;display:flex;flex-direction:column;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#live .lbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#live h1{font:700 1.05rem var(--display);margin:0}
#live h1 span{color:var(--red)}
#lNet{color:var(--bad);font-weight:600;font-size:14px}
#lCount{color:var(--muted);font-weight:600}
#grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,240px),1fr));gap:12px;align-content:start;padding:2px}
#lEmpty{color:var(--muted);font-weight:600;padding:24px;text-align:center;grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:opacity .3s}
.card.quiet{opacity:.55}
.card.fresh{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage)}
.card .ch{display:flex;justify-content:space-between;gap:6px;font:600 14px var(--display)}
.card .ch span:last-child{color:var(--muted);white-space:nowrap}
.card .pg{position:relative;background:#fff;border-radius:6px;overflow:hidden}
.card img,.card canvas,#fPage img,#fPage canvas{display:block;width:100%;height:auto;pointer-events:none}
.card canvas,#fPage canvas{position:absolute;inset:0;height:100%}
#focus{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#focus .lbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#focus h1{font:700 1.05rem var(--display);margin:0}
#focus h1 span:last-child{color:var(--red)}
#fNet{color:var(--bad);font-weight:600;font-size:14px}
#fNames{display:flex;gap:5px;flex-wrap:wrap}
#fDots{display:flex;gap:5px;overflow-x:auto;padding:3px 2px}#fDots button{flex:none}
#fNames button{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 14px;position:relative}
#fNames button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
#fNames button.fresh::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--sage);border:2px solid #fff}
#fNames button.quiet{opacity:.55}
#fNames .keychip{display:inline-flex;align-items:center;gap:5px;color:var(--good);border-color:var(--good)}
#fNames .keychip[aria-current="true"]{background:var(--good);color:#fff}
#fNames .keychip .ic{width:18px;height:18px}
#fDots button{min-width:38px;min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:600 13px var(--display);padding:0 3px}
#fDots button.ink{background:var(--mint)}
#fDots button.here{box-shadow:inset 0 -4px 0 var(--sage)}
#fDots button[aria-current="true"]{outline:3px solid var(--navy);outline-offset:-3px}
#fWhere{color:var(--muted);font-weight:600}
#fScroll{flex:1;min-height:0;overflow:auto;border-radius:12px;background:#e9e3d8;padding:8px}
#fPage{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15);width:min(100%,1100px)}
#fWait b{font-weight:700}#fWait.has{background:#e07a1f;color:#fff;border-color:#e07a1f}
.wait{display:inline-block;min-width:20px;height:20px;border-radius:999px;background:#e07a1f;color:#fff;font:700 12px/20px var(--display);text-align:center;padding:0 5px;margin-left:5px}
/* the teacher's review of a student's answers */
#rev{width:min(380px,36vw);overflow:auto;display:flex;flex-direction:column;gap:8px;-webkit-user-select:text;user-select:text}
#rev .none{color:var(--muted);font-weight:600;padding:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.rq.waiting{border-color:#e07a1f;box-shadow:inset 4px 0 0 #e07a1f}
.rq h3{font:700 15px var(--display);margin:0;display:flex;justify-content:space-between;gap:6px;cursor:pointer}
.rq h3 span{color:var(--muted);font-weight:600;font-size:13px}
.rq .pa{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px;align-items:baseline}
.rq .pa .k{color:var(--muted);font-weight:600}
.rq .pa .v{font-weight:700;text-align:right}
.rq .pa .m{grid-column:1/-1;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.rq .m .ic{width:16px;height:16px}
.rq .m.y{color:var(--good)}.rq .m.n{color:var(--bad)}.rq .m.t{color:var(--muted)}
.rq textarea{font:500 15px var(--body);min-height:54px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--bg);resize:vertical}
.rq .btns{display:flex;gap:6px}
.rq .btns button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.rq .btns .y{color:var(--good)}.rq .btns .n{color:var(--bad)}
.rq .btns .y.on{background:var(--good);color:#fff;border-color:var(--good)}.rq .btns .n.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.rq .sent{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- print (Save PDF) ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  #app,#gate{display:none!important}
  #print{display:block}
  #print img{display:block;width:210mm;height:296mm;object-fit:contain;break-after:page}
}
</style>
</head>
<body>
<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1 id="gTitle">Scitem Class</h1>
    <label id="gNameL">Your name<input id="gName" maxlength="30"></label>
    <label id="gCodeL" hidden>รหัสครู<input id="gCode" type="password"></label>
    <div class="err" id="gErr" aria-live="polite"></div>
    <button class="big" id="gGo">Start</button>
  </form>
</div>

<div id="app" hidden>
  <div id="bar">
    <h1 id="title"></h1><span id="who"></span>
    <select id="stu" hidden aria-label="นักเรียน"></select>
    <span class="sp"></span>
    <button class="b i" id="tPen" aria-pressed="true" aria-label="Pen" title="Pen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="sw" id="penSw"></span></button>
    <span id="colors" role="group" aria-label="Pen colour"></span>
    <button class="b i" id="tErase" aria-pressed="false" aria-label="Eraser" title="Eraser"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
    <button class="b i" id="tSel" aria-pressed="false" aria-label="Lasso" title="Lasso: circle ink, then drag it"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 22a5 5 0 0 1-2-4"/><path d="M3.3 14A6.8 6.8 0 0 1 2 10c0-4.4 4.5-8 10-8s10 3.6 10 8-4.5 8-10 8a12 12 0 0 1-5-1"/><circle cx="5" cy="16" r="2"/></svg></button>
    <button class="b i" id="tHand" aria-pressed="false" aria-label="Scroll with finger" title="Finger scrolls the page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3-2.8L8 15"/></svg></button>
    <button class="b i" id="tUndo" aria-label="Undo" title="Undo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="b i" id="tClear" aria-label="Clear page" title="Clear page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    <button class="b" id="tPull" hidden aria-pressed="false">งานน้อง</button>
    <button class="b" id="tKey" hidden aria-pressed="false">เฉลย</button>
    <button class="b" id="send">Send to teacher</button>
    <button class="b i" id="saveBtn" aria-label="Save PDF" title="Save PDF"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
  </div>
  <div id="nav">
    <button class="arr" id="prev" aria-label="Previous page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div id="dots"></div>
    <button class="arr" id="next" aria-label="Next page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    <span id="status" aria-live="polite"></span><span id="net"></span><span id="note"></span>
  </div>
  <div id="work"><div id="scroll"><div id="pages"><div id="page"><img id="img" alt=""><canvas id="cPull"></canvas><canvas id="cMine"></canvas><canvas id="cKey"></canvas><canvas id="cRed"></canvas><canvas id="cSel"></canvas><span id="keyTag" hidden>เฉลย</span></div></div></div>
  <aside id="ans" hidden aria-label="Answers"></aside></div>
</div>
<div id="live" hidden>
  <div class="lbar">
    <h1><span id="lTitle"></span> · <span>จอครูดูสด (ซ่อน)</span></h1>
    <span id="lCount"></span><span id="lNet" aria-live="polite"></span>
    <span class="sp"></span>
    <button class="b i" id="lClear" title="ลบที่ทดและคำตอบของทุกคน"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>ล้างห้อง</span></button>
  </div>
  <div id="grid"><div id="lEmpty">รอน้องเข้าห้อง… (น้องเปิดลิงก์ชีทแล้วใส่ชื่อ ที่ทดจะขึ้นตรงนี้ทันที)</div></div>
</div>
<div id="focus" hidden>
  <div class="lbar">
    <h1><span id="fTitle"></span> · <span>จอซ่อน</span></h1>
    <span id="fWhere"></span><span id="fNet"></span>
    <span class="sp"></span>
    <button class="b i" id="fWait" title="ไปที่คำตอบที่รอตรวจ"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1Z"/></svg><span>รอตรวจ <b id="fWaitN">0</b></span></button>

<script>
(function(){
"use strict";
const CFG={"id":"heat4","title":"ความร้อนรวบยอด & สมบัติของสาร","pages":32,"sheet":"https://script.google.com/macros/s/AKfycbzIaVMqROaTFaDN36SwCif7pWF_KEE7GroEUj2V5c9BM2gg4Y2v3wXbUOf-P4T0aBygnw/exec","fb":{"key":"AIzaSyClZhItG5C3aaz413ToeXPDKzh6Aw5y9CU","db":"https://scitem-live-default-rtdb.asia-southeast1.firebasedatabase.app"}};

/* ---------- gate: the student types her name; both teacher screens need the teacher code (it opens the answer key) ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// key.json = the answer key pages, AES-GCM with the teacher code (tools/build-sheet-class.mjs); only the teacher screens fetch it
let KEYBLOB=null;
async function openKey(code){
  if(!KEYBLOB)KEYBLOB=await (await fetch("key.json",{cache:"no-cache"})).json();
  const B=KEYBLOB;
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.salt),iterations:B.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.iv)},key,b64(B.ct))));
}
let ME=load(K.me,{}),PW="",KEYPAGES=null,KEYANS={},KEYMAP=null,KEYQ={},KEYH={};

const mine=()=>W[P(idx)]||(W[P(idx)]={ink:[],sentAt:0,sentLen:-1});

/* ---------- the Sheet: cput/cget = the student's pages, rput/rget = the teacher's red ink (tools/check-sheet.gs) ---------- */
// d:5 = points in 1/5000 of the page (older ink: 1/1000)
const packInk=ink=>ink.map(s=>({c:s.c,e:s.e?1:0,d:5,p:s.p.map((v,j)=>j%3===2?Math.round(v*9):Math.round(v*5000))}));
const arr=v=>Array.isArray(v)?v:v&&typeof v==="object"?Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]):[];   // Firebase may hand an array back as {0:…,1:…}
const unpackInk=ink=>arr(ink).filter(s=>s&&s.p).map(s=>{const d=s.d===5?5000:1000;return {c:s.c,e:!!s.e,p:arr(s.p).map((v,j)=>j%3===2?v/9:v/d)};});
async function post(body){
  let r,t;
  const ab=new AbortController(),tm=setTimeout(()=>ab.abort(),25000);
  try{r=await fetch(SHEET,{method:"POST",body:JSON.stringify(body),signal:ab.signal});t=await r.text();}
  catch(e){throw new Error("fetch: "+e.message);}finally{clearTimeout(tm);}
  let j;try{j=JSON.parse(t);}catch(e){throw new Error("HTTP "+r.status+": "+t.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,140));}
  if(!j.ok)throw new Error(j.error||"sheet");return j;
}

/* a page of pencil can pass what the Sheet keeps (360 000 characters a page): drop every other point until it fits */
const SHEET_MAX=340000;
function fitRec(rec){
  let s=JSON.stringify(rec),ink=rec.ink||[];
  const thin=p=>{if(p.length<=6)return p;const o=[];for(let i=0;i<p.length;i+=3)if(i%6===0||i===p.length-3)o.push(p[i],p[i+1],p[i+2]);return o;};
  while(s.length>SHEET_MAX&&ink.length){const next=ink.map(k=>Object.assign({},k,{p:thin(k.p)}));
    ink=JSON.stringify(next).length<JSON.stringify(ink).length?next:[];s=JSON.stringify(Object.assign({},rec,{ink}));}
  return s;
}
// pages waiting for the Sheet: kept in memory and copied to localStorage when it has room (a full iPad
// storage made the copy fail silently, so a page could look sent and never leave)
let flushing=false,OUTQ=null,lastErr="";
const outq=()=>OUTQ||(OUTQ=load(K.out,{}));
async function flush(){
  if(!SHEET||STAFF||flushing)return;
  const out=outq(),ids=Object.keys(out);if(!ids.length){setNet("");return;}
  flushing=true;let failed=0;
  for(const id of ids){
    const rec=out[id];
    try{await post({action:"cput",cls:CLASS,name:ME.name||"",id,data:fitRec(rec)});
      if(out[id]===rec){delete out[id];save(K.out,out);}
      if(W[id]&&W[id].sentAt===rec.at){W[id].okAt=rec.at;save(K.work,W);}}
    catch(e){failed++;lastErr=e.message;}
  }
  flushing=false;
  setNet(failed?"Not saved yet ("+lastErr+"). Trying again…":"");
  render();
}
function sendPage(){
  const w=mine(),rec={ink:packInk(w.ink),at:Date.now()};
  w.sentAt=rec.at;w.sentLen=inkSig(w.ink);
  if(!save(K.work,W))setNet("iPad storage is full: send each page, it still goes to the teacher");
  if(SHEET){outq()[P(idx)]=rec;save(K.out,OUTQ);flush();}
  else{const sent=load(K.sent,{});rec.name=ME.name||"";sent[P(idx)]=rec;save(K.sent,sent);}
  render();
}
const inkSig=ink=>ink.reduce((a,s)=>a+s.p.length+(s.e?7:1),0);
// View 2026-10-21: the teacher's ink is not shown on the student's screen; red stays on #teacher and in the saved PDF
const RED_TO_STUDENT=false;
async function pullRed(){
  if(STAFF||!RED_TO_STUDENT)return;const id=P(idx);
  if(!SHEET){RED=load(K.red,{});drawRed();return;}
  try{const j=await post({action:"rget",cls:CLASS,name:ME.name||"",id});
    const r=unpackInk(j.red?JSON.parse(j.red):[]);
    if(JSON.stringify(r)!==JSON.stringify(RED[id]||[])){RED[id]=r;if(P(idx)===id)drawRed();}}catch(e){}
}
let lastAt=0;
async function pullAll(){
  if(!SHEET){
    const sent=load(K.sent,{}),all={};
    for(const [id,r] of Object.entries(sent))(all[r.name]||(all[r.name]={}))[id]=Object.assign({},r,{ink:unpackInk(r.ink)});
    const s=JSON.stringify(all);if(s===JSON.stringify(ALL))return false;ALL=all;
  }else{
    try{
      const j=await post({action:"cget",cls:CLASS,pw:PW,since:lastAt});setNet("");
      if(!j.rows.length)return false;
      for(const r of j.rows){
        lastAt=Math.max(lastAt,r.at);
        const d=JSON.parse(r.data);d.ink=unpackInk(d.ink);d.at=r.at;
        (ALL[r.name]||(ALL[r.name]={}))[r.id]=d;
        if(r.red!=null&&!RED[r.name+"|"+r.id])RED[r.name+"|"+r.id]=unpackInk(JSON.parse(r.red||"[]"));
      }
    }catch(e){
      if(e.message==="pw"){
        // the Sheet's password (tools/check-sheet.gs) is not the teacher code: ask once for this tab
        const p=prompt("รหัสครูในชีท (Apps Script) ไม่ตรงกับรหัสนี้ ใส่รหัสของชีท:");
        if(p){PW=p.trim();sessionStorage.setItem("scitem-sheet-pw",PW);}
        setNet("โหลดไม่ได้: รหัสครูไม่ตรงกับในชีท");
      }else setNet("โหลดไม่ได้ ("+e.message+")");
      return false;
    }
  }
  const names=Object.keys(ALL);
  const latest=n=>Math.max(...Object.values(ALL[n]).map(x=>x.at||0));
  if(names.length&&(!STU||!ALL[STU]))STU=names.sort((a,b)=>latest(b)-latest(a))[0];
  const sel=$("stu");
  if(TEACHER&&names.length){if(sel.options.length!==names.length)sel.innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join("");sel.hidden=false;sel.value=STU;}
  SENT=ALL[STU]||{};
  return true;
}
let redT=null;
function pushRed(){
  if(!SHEET){save(K.red,RED);return;}
  clearTimeout(redT);const key=redKey(),id=P(idx),name=STU;
  redT=setTimeout(()=>{post({action:"rput",cls:CLASS,pw:PW,name,id,red:JSON.stringify(packInk(RED[key]||[]))}).catch(()=>setNet("ส่งหมึกครูไม่ได้"));},1200);
}

/* ---------- live ink on Firebase (Realtime Database over REST, no SDK): each finished stroke goes up, #live streams them ---------- */
const FB=CFG.fb||null;                     // {key: web API key, db: database URL} from FIREBASE in src/data/catalog.ts; null = no live ink
const FB_TEACHER="teacher@scitem.net";     // the only account that can read a class (rules: tools/firebase-rules.json)
const FBK="scitem-fb-anon";                // the student's anonymous sign-in, kept so a reload stays the same card on #live
let FBA=null;                              // {uid, id = ID token, rt = refresh token, exp}
async function fbPost(url,body,form){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":form?"application/x-www-form-urlencoded":"application/json"},body:form?body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||"HTTP "+r.status);
  return j;
}
function fbSet(a,keep){
  FBA={uid:a.localId||a.user_id,id:a.idToken||a.id_token,rt:a.refreshToken||a.refresh_token,exp:Date.now()+1000*(+(a.expiresIn||a.expires_in)||3600)};
  if(keep)save(FBK,{uid:FBA.uid,rt:FBA.rt});
}
async function fbToken(){                  // ID tokens last an hour: refresh with the refresh token, or sign the student in anonymously
  if(FBA&&FBA.exp>Date.now()+120000)return FBA.id;
  const keep=!STAFF,old=FBA||(keep?load(FBK,null):null);
  if(old&&old.rt){
    try{fbSet(await fbPost("https://securetoken.googleapis.com/v1/token?key="+FB.key,"grant_type=refresh_token&refresh_token="+encodeURIComponent(old.rt),true),keep);return FBA.id;}
    catch(e){if(STAFF||!/TOKEN|USER/.test(e.message))throw e;}   // offline: try later; a dead token: start a new card
  }
  if(STAFF)throw new Error("sign in again");
  fbSet(await fbPost("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB.key,{returnSecureToken:true}),true);
  return FBA.id;
}
async function fbTeacher(pw){fbSet(await fbPost("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+FB.key,{email:FB_TEACHER,password:pw,returnSecureToken:true}),false);}
const fbUrl=(path,tok,root)=>FB.db.replace(/\/+$/,"")+"/"+(root||"live")+"/"+CLASS+path+".json?auth="+encodeURIComponent(tok);
// one Firebase stream (server-sent events): put/patch events land in tree via set(path, data); reconnects with a fresh token
function fbStream(path,root,set,onNet){
  let es=null,dead=false;
  const go=async()=>{
    if(es)es.close();
    let tok;try{tok=await fbToken();}catch(e){onNet("ต่อไม่ได้ ("+e.message+") ลองใหม่…");setTimeout(go,5000);return;}
    const me=es=new EventSource(fbUrl(path,tok,root));
    const on=(t,fn)=>me.addEventListener(t,ev=>{if(me===es)fn(ev.data?JSON.parse(ev.data):null);});
    on("put",d=>set(d.path,d.data));
    on("patch",d=>{const base=d.path.replace(/\/+$/,"");for(const [k,v] of Object.entries(d.data||{}))set(base+"/"+k,v);});
    on("auth_revoked",()=>{FBA.exp=0;go();});   // the hour is up: new token, new stream
    on("cancel",()=>{me.close();onNet("อ่านไม่ได้: เช็ค Rules ใน Firebase");});
    me.onopen=()=>onNet("");
    me.onerror=()=>onNet("หลุด กำลังต่อใหม่…");
  };
  go();
}
function pathSet(tree,path,data){           // returns the tree (a new one when the whole thing is replaced)
  const ks=path.split("/").filter(Boolean);
  if(!ks.length)return data&&typeof data==="object"?data:{};
  let o=tree;
  for(const k of ks.slice(0,-1)){if(!o[k]||typeof o[k]!=="object")o[k]={};o=o[k];}
  const last=ks[ks.length-1];if(data==null)delete o[last];else o[last]=data;
  return tree;
}

/* ---------- answer boxes (CFG.qs): a number and a unit per part; #live sees them checked against the key, the teacher's
   right/wrong and hint come back (back/<class>/<uid>/<qid>) ---------- */

const QINFO={},QORDER=[];
for(const [pid,list] of Object.entries(QS))for(const q of list){QINFO[q.id]=Object.assign({pg:+pid.slice(1)-1},q);QORDER.push(q.id);}
const ICONS={"pen": "<path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"/>", "eraser": "<path d=\"m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21\"/><path d=\"M22 21H7\"/><path d=\"m5 11 9 9\"/>", "lasso": "<path d=\"M7 22a5 5 0 0 1-2-4\"/><path d=\"M3.3 14A6.8 6.8 0 0 1 2 10c0-4.4 4.5-8 10-8s10 3.6 10 8-4.5 8-10 8a12 12 0 0 1-5-1\"/><circle cx=\"5\" cy=\"16\" r=\"2\"/>", "hand": "<path d=\"M18 11V6a2 2 0 0 0-4 0v5\"/><path d=\"M14 10V4a2 2 0 0 0-4 0v6\"/><path d=\"M10 10.5V6a2 2 0 0 0-4 0v8\"/><path d=\"M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3-2.8L8 15\"/>", "undo": "<path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10.5a5.5 5.5 0 0 1 0 11H11\"/>", "trash": "<path d=\"M3 6h18\"/><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\"/><path d=\"M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/>", "left": "<path d=\"m15 18-6-6 6-6\"/>", "right": "<path d=\"m9 18 6-6-6-6\"/>", "grid": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>", "follow": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 2v2M12 20v2M2 12h2M20 12h2\"/>", "inbox": "<path d=\"M22 12h-6l-2 3h-4l-2-3H2\"/><path d=\"M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1Z\"/>", "print": "<path d=\"M6 9V2h12v7\"/><path d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"/><rect x=\"6\" y=\"14\" width=\"12\" height=\"8\"/>", "check": "<path d=\"M20 6 9 17l-5-5\"/>", "x": "<path d=\"M18 6 6 18M6 6l12 12\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/>", "send": "<path d=\"m22 2-7 20-4-9-9-4Z\"/><path d=\"M22 2 11 13\"/>", "help": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3\"/><path d=\"M12 17h.01\"/>"};
const icon=k=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k]+'</svg>';
const prettyU=u=>String(u||"").replace(/\^2/g,"²").replace(/\^3/g,"³");
// what students type: "6", "20,000", "2x10^4", "0.5", "3/2", "2√10", "20π²", "√(3)" (from src/pages/teacher.astro); NaN if it can't
function evalAns(raw){
  let t=String(raw||"").replace(/[,\s]/g,"").replace(/[−–]/g,"-").replace(/[×xX]/g,"*").replace(/²/g,"^2").replace(/³/g,"^3");
  t=((t.match(/^[0-9.+\-*/^()√π]+/)||[""])[0]).replace(/[+\-*/^(√]+$/,"");
  let i=0;const peek=()=>t[i];
  const num=()=>{const m=t.slice(i).match(/^\d*\.?\d+/);if(!m)return NaN;i+=m[0].length;return Number(m[0]);};
  const primary=()=>{const c=peek();if(c==="π"){i++;return Math.PI;}if(c==="√"){i++;return Math.sqrt(power());}
    if(c==="("){i++;const v=expr();if(peek()===")")i++;return v;}return num();};
  const power=()=>{const b=primary();if(peek()==="^"){i++;return b**unary();}return b;};
  const unary=()=>peek()==="-"?(i++,-unary()):power();
  const term=()=>{let v=unary();for(;;){const c=peek();
    if(c==="*"){i++;v*=unary();}else if(c==="/"){i++;v/=unary();}else if(c&&/[\dπ√(.]/.test(c))v*=power();else return v;}};
  const expr=()=>{let v=term();while(peek()==="+"||peek()==="-")v=t[i++]==="+"?v+term():v-term();return v;};

function normU(u){                          // "m/s2", "m/s²", "เมตร/วินาที" … to one spelling
  let t=String(u||"").toLowerCase().replace(/\s+/g,"").replace(/²/g,"^2").replace(/³/g,"^3").replace(/\*\*/g,"^").replace(/[·∙]/g,"");
  for(const [a,b] of [["เซนติเมตร","cm"],["มิลลิเมตร","mm"],["มิลลิลิตร","ml"],["ลิตร","l"],["กิโลกรัม","kg"],["กรัม","g"],["เมตร","m"],
    ["นิวตัน","n"],["วินาที","s"],["เรเดียน","rad"],["องศา","°"],["degrees","°"],["degree","°"],["deg","°"],["ร้อยละ","%"],["เปอร์เซ็นต์","%"],["เท่า",""],["ส่วน",""]])t=t.split(a).join(b);

  kg:["M",1],g:["M",1e-3],"kg/m^3":["D",1],"g/cm^3":["D",1000],"g/ml":["D",1000]};
function checkPart(key,a){                  // -> {ok: true/false/null (teacher decides), num, unit}
  if(!key)return {ok:null};
  if(key.c)return {ok:!!a&&a.c===key.a};
  if(key.t||!a)return {ok:a?null:false};
  const x=evalAns(a.n),y=evalAns(key.v),ua=normU(a.u),ub=normU(key.u);

  if(!unit&&UNITS[ua]&&UNITS[ub]&&UNITS[ua][0]===UNITS[ub][0]){fa=UNITS[ua][1];fb=UNITS[ub][1];unit=true;}
  const num=Number.isFinite(x)&&Math.abs(x*fa-y*fb)<=(key.tol||0.005)*Math.max(Math.abs(y*fb),1e-12);

}

      const q=v=>Math.round(v*5000)/5000;
      for(const s of SEL.ss)for(let j=0;j<s.p.length;j+=3){s.p[j]=q(s.p[j]);s.p[j+1]=q(s.p[j+1]);}
      MOVES.push({list:SEL.list,ss:SEL.ss,dx:d.dx,dy:d.dy,n:SEL.list.length});changed();
    }
    drawSel();return;
  }
  if(!curS||e.pointerId!==curS.id)return;curS=null;paintMine();changed();   // repaint: the live pieces joined into one smooth line
}
target.addEventListener("pointerup",endStroke);target.addEventListener("pointercancel",endStroke);

/* ---------- Select: circle ink with the pen (or finger), drag inside the box to move it, tap outside to let go ---------- */
function inPoly(px,py,poly){
  let ins=false;
  for(let i=0,j=poly.length-2;i<poly.length;j=i,i+=2){
    const xi=poly[i],yi=poly[i+1],xj=poly[j],yj=poly[j+1];
    if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins;
  }
  return ins;
}
function pick(poly){                       // a stroke is picked when most of it is inside the loop
  SEL=null;if(poly.length<8)return;        // a tap: nothing picked (= deselect)
  const list=myStrokes(),ss=list.filter(s=>{let n=0,k=0;for(let j=0;j<s.p.length;j+=3,k++)if(inPoly(s.p[j],s.p[j+1],poly))n++;return n*2>=k;});
  if(ss.length)SEL={list,ss};
}
function selBox(){
  if(!SEL||SEL.list!==myStrokes())return SEL=null;
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const s of SEL.ss)for(let j=0;j<s.p.length;j+=3){a=Math.min(a,s.p[j]);b=Math.min(b,s.p[j+1]);c=Math.max(c,s.p[j]);d=Math.max(d,s.p[j+1]);}
  const m=0.012;return [a-m,b-m*0.7,c+m,d+m*0.7];
}
function inSel(p){const r=selBox();return !!r&&p[0]>=r[0]&&p[0]<=r[2]&&p[1]>=r[1]&&p[1]<=r[3];}
function drawSel(){
  const g=x.sel,w=cSel.width,h=cSel.height;g.clearRect(0,0,w,h);
  g.lineWidth=Math.max(1.5,w/500);g.setLineDash([g.lineWidth*4,g.lineWidth*3]);g.strokeStyle="#1f5fa8";
  if(lasso&&lasso.p.length>2){
    g.beginPath();g.moveTo(lasso.p[0]*w,lasso.p[1]*h);
    for(let j=2;j<lasso.p.length;j+=2)g.lineTo(lasso.p[j]*w,lasso.p[j+1]*h);
    g.stroke();
  }
  const r=selBox();
  if(r){g.fillStyle="rgba(31,95,168,.08)";g.fillRect(r[0]*w,r[1]*h,(r[2]-r[0])*w,(r[3]-r[1])*h);g.strokeRect(r[0]*w,r[1]*h,(r[2]-r[0])*w,(r[3]-r[1])*h);}
  g.setLineDash([]);
}
function unselect(){SEL=null;lasso=null;drawSel();}
function undoMove(){                       // Undo after a move puts the ink back (strokes drawn since come off first)
  const l=myStrokes();
  while(MOVES.length&&(MOVES[MOVES.length-1].list!==l||MOVES[MOVES.length-1].n>l.length))MOVES.pop();
  const m=MOVES[MOVES.length-1];if(!m||m.n!==l.length)return false;
  MOVES.pop();
  const q=v=>Math.round(v*5000)/5000;
  for(const s of m.ss)for(let j=0;j<s.p.length;j+=3){s.p[j]=q(s.p[j]-m.dx);s.p[j+1]=q(s.p[j+1]-m.dy);}
  return true;
}

/* ---------- two fingers: pinch to zoom the sheet (and pan), the pencil keeps writing ---------- */
const scr=$("scroll"),fingers=e=>[...e.touches].filter(t=>t.touchType!=="stylus");
function dropFingerInk(){                  // the first finger may have started ink before the second one landed
  if(curS&&curS.touch){const l=myStrokes(),i=l.lastIndexOf(curS.s);if(i>=0)l.splice(i,1);curS=null;paintMine();}
  if(lasso&&lasso.touch)lasso=null;
  if(drag&&drag.touch){SEL.ss.forEach((s,k)=>{s.p=drag.orig[k];});drag=null;paintMine();}
  drawSel();
}
scr.addEventListener("touchstart",e=>{
  const f=fingers(e);if(f.length<2||pinch)return;
  e.preventDefault();dropFingerInk();
  const [a,b]=f,mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
  const sr=scr.getBoundingClientRect(),pr=$("page").getBoundingClientRect();
  pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,z:zoom,
    fx:(mx-pr.left)/pr.width,fy:(my-pr.top)/pr.height,             // the spot of the sheet under the fingers stays under them
    ox:pr.left-sr.left+scr.scrollLeft,oy:pr.top-sr.top+scr.scrollTop};
},{passive:false});
scr.addEventListener("touchmove",e=>{
  if(!pinch)return;const f=fingers(e);if(f.length<2)return;
  if(e.cancelable)e.preventDefault();
  const [a,b]=f,mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
  zoom=Math.min(ZMAX,Math.max(ZMIN,pinch.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d));
  const [w,h]=size(),sr=scr.getBoundingClientRect();
  scr.scrollLeft=pinch.ox+pinch.fx*w-(mx-sr.left);scr.scrollTop=pinch.oy+pinch.fy*h-(my-sr.top);
},{passive:false});
function endPinch(e){if(pinch&&fingers(e).length<2){pinch=null;fit();}}
scr.addEventListener("touchend",endPinch);scr.addEventListener("touchcancel",endPinch);
// Safari's own page zoom
for(const t of ["gesturestart","gesturechange"])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
// stop iPad Safari turning a pencil stroke into a scroll (see tools/light-p5-shell.html); fingers still scroll in ✋ / pencil mode
$("page").addEventListener("touchstart",e=>{
  const stylus=[...e.changedTouches].some(t=>t.touchType==="stylus");
  if(stylus&&!penOnly){penOnly=true;try{localStorage.setItem("scitem-pen","1")}catch(err){}setScrolly();}
  const onSel=sel&&e.touches.length===1&&inSel(ptOf(e.touches[0]));   // a finger on a selection drags it instead of scrolling
  if(stylus||onSel||!(penOnly||hand))e.preventDefault();},{passive:false});
$("page").addEventListener("touchmove",e=>{if([...e.touches].some(t=>t.touchType==="stylus")||drag||!(penOnly||hand))e.preventDefault();},{passive:false});
setScrolly();

const press=(on,off)=>{on.setAttribute("aria-pressed","true");for(const b of off)b.setAttribute("aria-pressed","false");};
$("tPen").onclick=()=>{erase=false;sel=false;hand=false;unselect();press($("tPen"),[$("tErase"),$("tSel"),$("tHand")]);setScrolly();};
$("tErase").onclick=()=>{erase=true;sel=false;hand=false;unselect();press($("tErase"),[$("tPen"),$("tSel"),$("tHand")]);setScrolly();};
$("tSel").onclick=()=>{sel=true;erase=false;hand=false;press($("tSel"),[$("tPen"),$("tErase"),$("tHand")]);setScrolly();};
$("tHand").onclick=()=>{hand=!hand;$("tHand").setAttribute("aria-pressed",hand);setScrolly();};
$("tUndo").onclick=()=>{const l=myStrokes();if(!undoMove()){if(!l.length)return;l.pop();}SEL=null;changed();drawAll();};
$("tClear").onclick=()=>{const l=myStrokes();if(!l.length||!confirm(TEACHER?"ลบหมึกครูในหน้านี้?":SHOW?"ลบหมึกในหน้านี้?":"Clear this page?"))return;l.length=0;SEL=null;changed();drawAll();};
// View 2026-10-26: zoom with fingers only (no +/− buttons); a trackpad pinch (ctrl + wheel) on a computer
let wheelT=null;
scr.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();zoom=Math.min(ZMAX,Math.max(ZMIN,zoom*Math.exp(-e.deltaY/150)));size();clearTimeout(wheelT);wheelT=setTimeout(fit,120);},{passive:false});

/* ---------- Save PDF: every page with ink, one A4 each ---------- */
function pageImage(i,lists){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext("2d");g.drawImage(im,0,0);
      const l=document.createElement("canvas");l.width=c.width;l.height=c.height;const lx=l.getContext("2d");
      for(const list of lists){lx.clearRect(0,0,l.width,l.height);for(const s of list)drawStroke(lx,l,s);g.drawImage(l,0,0);}
      res(c.toDataURL("image/jpeg",0.85));
    };
    im.src="p/"+P(i)+".jpg";
  });
}
$("saveBtn").onclick=async()=>{
  const p=$("print");p.innerHTML="";flash("…");
  for(let i=0;i<N;i++){
    const ink=TEACHER?(SENT[P(i)]&&SENT[P(i)].ink)||[]:(W[P(i)]&&W[P(i)].ink)||[];
    const red=RED[redKey(i)]||[];
    if(!ink.length&&!red.length)continue;
    const im=document.createElement("img");im.src=await pageImage(i,[ink,red]);p.appendChild(im);
  }
  if(!p.children.length){flash(TEACHER?"ยังไม่มีงาน":"Nothing written yet");return;}
  document.title=CFG.title+" · "+(TEACHER?STU:ME.name||"");
  setTimeout(()=>window.print(),300);
};
})();
