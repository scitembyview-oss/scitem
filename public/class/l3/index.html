<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scitem Class</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Sarabun:wght@400;600&display=swap">
<style>
/* Built by tools/build-class.mjs from tools/class-shell.html — edit those, not the built page.
   One page, two screens: student (default) and teacher (#teacher). Left: question + number line + keypad. Right: scratch paper. */
:root{
  --bg:#f8f3ea; --card:#fff; --fg:#1f2836; --muted:#5d6676; --line:#ddd4c6;
  --navy:#2b3a55; --peach:#db9e89; --sage:#729783; --mint:#e9f2eb;
  --right:#4f8a6a; --left:#c8504a; --good:#2f7a4f; --bad:#b03a2e; --tick:#8a93a3; --hl:#f6e3da; --red:#d62828;
  --display:"Poppins","Sarabun",system-ui,sans-serif; --body:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
button{font:600 16px var(--display);color:var(--fg);cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg);z-index:50}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
#gate h1{font:700 1.5rem var(--display);margin:0}
#gate label{font:600 15px var(--display);display:flex;flex-direction:column;gap:6px}
#gate input{font:600 20px var(--display);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);-webkit-user-select:text;user-select:text}
#gate .err{color:var(--bad);min-height:1.4em;font-weight:600}
.big{font:700 1.15rem var(--display);min-height:56px;padding:0 24px;border-radius:14px;border:none;background:var(--navy);color:#fff}
.big:disabled{opacity:.45}

/* ---------- app ---------- */
#app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,38%);gap:12px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#left{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#top h1{font:700 1.15rem var(--display);margin:0}
#top .who{color:var(--muted);font-weight:600}
#top .sp{flex:1}
.ghost{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
#nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#nav .arr{min-width:52px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px}
#dots{display:flex;gap:5px;flex-wrap:wrap;flex:1}
#dots button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:600 14px var(--display);position:relative;padding:0 4px}
#dots button[aria-current="true"]{outline:3px solid var(--navy);outline-offset:-3px}
#dots button.m1{border-bottom:4px solid var(--sage)}
#dots button.m2{border-bottom:4px solid var(--peach)}
#dots button.m3{border-bottom:4px solid var(--navy)}
#dots button.m4{border-bottom:4px solid #6b7280}
#sets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#sets button{flex:none;min-width:48px;min-height:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 14px var(--display);position:relative}
#sets button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
#sets button.new::after,#stu{font:600 16px var(--display);min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 8px}
.net{color:var(--bad);font-weight:600;font-size:14px}
.setname{color:var(--muted);font-weight:600;font-size:15px}
.reveal{align-self:flex-start;min-height:36px;font-size:14px}
.tans{font-size:16px;color:var(--muted)}
.q.long{font-size:clamp(1.15rem,2.6vw,1.5rem);text-align:left;line-height:1.45}
#dots button.ok{background:var(--mint)}
#dots button.ok2{background:#fbeccd}
#stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.code{font:700 1rem var(--display);color:var(--muted)}
.mode{font:600 14px var(--display);border-radius:999px;padding:3px 12px;color:#fff}
.mode.m1{background:var(--sage)} .mode.m2{background:var(--peach)} .mode.m3{background:var(--navy)} .mode.m4{background:#6b7280}
.status{margin-left:auto;color:var(--muted);font-weight:600;font-size:15px}
.q{font:700 clamp(1.8rem,4.6vw,2.8rem) var(--display);text-align:center}
.q .cur{background:var(--hl);border-radius:10px;padding:0 8px}
.ins{text-align:center;font:600 1.05rem var(--display);min-height:1.5em}
svg.nl{width:100%;height:auto;display:block;touch-action:none}
.fb{text-align:center;font:600 1.05rem var(--display);min-height:1.5em}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.ansrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ansbox{min-width:150px;min-height:56px;border:2px solid var(--navy);border-radius:14px;font:700 1.8rem var(--display);display:grid;place-items:center;padding:0 14px;background:#fff}
.ansbox.empty{color:var(--tick)}
.result{font:700 2rem var(--display);text-align:center;color:var(--navy)}
.ansbox.rw{min-width:260px;font-size:1.5rem}
.rwdone{font:700 1.4rem var(--display);text-align:center;color:var(--good)}
#pad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:560px;margin:0 auto;width:100%}
#pad button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:700 1.3rem var(--display)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- scratch ---------- */
#right{display:flex;flex-direction:column;gap:8px;min-height:0}
#tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tools .lab{font:600 15px var(--display);margin-right:auto}
#tools button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px}
#tools button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
#tools .sw{width:26px;height:26px;border-radius:50%;display:inline-block;vertical-align:middle}
#paperWrap{flex:1;min-height:0;display:grid;place-items:center}
#paper{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background-image:linear-gradient(#e7eef5 1px,transparent 1px),linear-gradient(90deg,#e7eef5 1px,transparent 1px);background-size:5% 3.333%;touch-action:none}
#paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#paper .redl{pointer-events:none}
body.teacher #paper .mine{pointer-events:none}
body.teacher #paper .redl{pointer-events:auto}
#redNote{font-size:15px;color:var(--red);font-weight:600;min-height:1.3em}

/* ---------- teacher ---------- */
body.teacher #top h1::after{content:" · จอครู";color:var(--red)}
.tlog{font-size:16px;line-height:1.6}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}

/* ---------- print (Save my work) ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{height:auto;overflow:visible;background:#fff}
  #app,#gate{display:none!important}
  #print{display:block;font-family:var(--body);color:#000}
  #print h1{font:700 20px var(--display);margin:0 0 4px}
  #print .sub{color:#555;margin-bottom:10px}
  #print .it{break-inside:avoid;display:grid;grid-template-columns:1fr 26%;gap:10px;border-top:1px solid #ccc;padding:8px 0}
  #print .pq{font:700 20px var(--display)}
  #print .pa{font-size:15px;margin:2px 0 4px}
  #print svg{width:100%;height:auto}
  #print img{width:100%;border:1px solid #ddd;border-radius:6px}
}
</style>
</head>
<body>
<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1 id="gTitle">Scitem Class</h1>
    <label id="gNameL">Your name<input id="gName" maxlength="30" required></label>
    <label><span id="gCodeT">Class code</span><input id="gCode" type="password" required></label>
    <div class="err" id="gErr" aria-live="polite"></div>
    <button class="big" id="gGo">Start</button>
  </form>
</div>

<div id="app" hidden>
  <div id="left">
    <div id="top">
      <h1 id="title"></h1><span class="who" id="who"></span>
      <select id="stu" hidden aria-label="นักเรียน"></select>
      <span class="sp"></span>
      <span class="net" id="net"></span>
      <button class="ghost" id="refresh" hidden>โหลดหน้าใหม่</button>
      <button class="ghost" id="saveBtn">Save my work</button>
    </div>
    <div id="sets"></div>
    <div id="nav">
      <button class="arr" id="prev" aria-label="Previous">◀</button>
      <div id="dots"></div>
      <button class="arr" id="next" aria-label="Next">▶</button>
    </div>
    <div class="legend" id="legend" hidden>
      <span><i style="background:var(--mint)"></i>เสร็จ ลอง 1 ครั้ง</span>
      <span><i style="background:#fbeccd"></i>เสร็จ ลองหลายครั้ง</span>
      <span><i style="background:#e07a1f;border-radius:50%"></i>เพิ่งส่งมา</span>
    </div>
    <section id="stage"></section>
  </div>
  <div id="right">
    <div id="tools">
      <span class="lab" id="padLab">Working out</span>
      <button id="tPen" aria-pressed="true" aria-label="Pen"><span class="sw" id="penSw"></span></button>
      <button id="tErase" aria-pressed="false">Eraser</button>
      <button id="tUndo">Undo</button>
      <button id="tClear">Clear</button>
    </div>
    <div id="paperWrap"><div id="paper"><canvas class="mine" id="cMine"></canvas><canvas class="redl" id="cRed"></canvas></div></div>
    <div id="redNote"></div>
  </div>
</div>
<div id="print"></div>

async function decrypt(code){
  const B=TEACHER?BLOB.t:BLOB.s;
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.salt),iterations:B.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.iv)},key,b64(B.ct))));
}

/* ---------- numbers: a line question counts in ticks; den ticks make 1 ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function show(t,den=1){
  if(den===1)return (t<0?M:"")+Math.abs(t);
  if(den===10){const v=t/10;return (v<0?M:"")+Math.abs(v).toFixed(Math.abs(t)%10?1:0);}
  if(t===0)return "0";const g=gcd(t,den),n=Math.abs(t)/g,d=den/g;return (t<0?M:"")+(d===1?n:n+"/"+d);
}
const term=(t,den)=>t<0?"("+show(t,den)+")":show(t,den);
const signed=([op,b])=>op==="-"?-b:b;

/* answer check: a small parser, so 4x + 5, 5 + 4x and 4 x+5 all count, and −1/2 = −0.5 */
function parse(src){
  const s=String(src).replace(/[−–]/g,"-").replace(/×/g,"*").replace(/÷/g,"/").replace(/²/g,"^2").replace(/³/g,"^3").replace(/\s+/g,"");
  let i=0;
  const peek=()=>s[i];
  function expr(){let v=termP();while(peek()==="+"||peek()==="-"){const op=s[i++],r=termP();const l=v;v=op==="+"?e=>l(e)+r(e):e=>l(e)-r(e);}return v;}
  function termP(){let v=unary();
    for(;;){const c=peek();
      if(c==="*"||c==="/"){i++;const r=unary(),l=v;v=c==="*"?e=>l(e)*r(e):e=>l(e)/r(e);}
      else if(c&&/[0-9.a-z(]/.test(c)){const r=unary(),l=v;v=e=>l(e)*r(e);}
      else return v;}}
  function unary(){if(peek()==="-"){i++;const u=unary();return e=>-u(e);}if(peek()==="+"){i++;return unary();}return power();}
  function power(){const b=atom();if(peek()==="^"){i++;const x=unary();return e=>Math.pow(b(e),x(e));}return b;}
  function atom(){const c=peek();
    if(c==="("){i++;const v=expr();if(s[i++]!==")")throw 0;return v;}
    const m=/^\d*\.?\d+/.exec(s.slice(i));if(m){i+=m[0].length;const n=Number(m[0]);return ()=>n;}
    if(c&&/[a-z]/.test(c)){i++;return e=>e[c];}
    throw 0;}
  const f=expr();if(i!==s.length)throw 0;return f;
}
function same(typed,want){
  const sides=x=>String(x).split("=");
  let a=sides(typed),b=sides(want);
  if(b.length===2){if(a.length===2){if(a[0].trim()!==b[0].trim())return false;a=a[1];}else a=a[0];b=b[1];}
  else{if(a.length!==1)return false;a=a[0];b=b[0];}
  try{
    const fa=parse(a),fb=parse(b);
    for(const e of [{x:1.7,y:-2.3,a:0.6,b:3.1},{x:-1.2,y:0.9,a:-2.4,b:1.3},{x:2.9,y:1.1,a:1.5,b:-0.7}]){
      const u=fa(e),v=fb(e);if(!isFinite(u)||Math.abs(u-v)>1e-9*Math.max(1,Math.abs(v)))return false;}
    return true;
  }catch(e){return false;}
}

/* ---------- the Sheet (tools/check-sheet.gs): cput/cget = the student's questions, rput/rget = the teacher's red ink ---------- */
const q3=v=>Math.round(v*1000);
const packInk=ink=>ink.map(s=>({c:s.c,e:s.e?1:0,p:s.p.map((v,j)=>j%3===2?Math.round(v*9):q3(v))}));
const unpackInk=ink=>(ink||[]).map(s=>({c:s.c,e:!!s.e,p:s.p.map((v,j)=>j%3===2?v/9:v/1000)}));
async function post(body){
  let r;
  // give up after 25 s, so a request that hangs (wifi dropping on the iPad) cannot stop everything sent after it
  const ab=new AbortController(),tm=setTimeout(()=>ab.abort(),25000);let t;
  try{r=await fetch(SHEET,{method:"POST",body:JSON.stringify(body),signal:ab.signal});t=await r.text();}
  catch(e){throw new Error("fetch: "+e.message);}finally{clearTimeout(tm);}
  let j;
  // what Google sent back instead of data (a login page, a script error…), so the teacher can tell us
  try{j=JSON.parse(t);}catch(e){throw new Error("HTTP "+r.status+": "+t.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,140));}
  if(!j.ok)throw new Error(j.error||"sheet");return j;
}
function setNet(t){$("net").textContent=t;}
let flushing=false;
async function flush(quiet){
  if(!SHEET||TEACHER||flushing)return;
  const out=load(K.out,{}),ids=Object.keys(out);if(!ids.length){setNet("");return;}
  flushing=true;
  // one question that will not go (too much ink, a hiccup) must not hold back the ones after it
  let failed=0;
  for(const id of ids){
    try{await post({action:"cput",cls:CLASS,name:ME.name||"",id,data:fitRec(out[id])});
      const now=load(K.out,{});if(now[id]&&now[id].at===out[id].at){delete now[id];save(K.out,now);}}
    catch(e){failed++;}
  }
  setNet(failed?"Saved. Will send when online.":"");if(!failed&&!quiet)flash("Sent to teacher");
  flushing=false;
}
/* the Sheet keeps up to 360 000 characters a question (tools/check-sheet.gs); a long page of pencil can pass that,
   so drop every other point of each stroke until it fits (the ink on her own screen stays as it is) */
const SHEET_MAX=340000;
function fitRec(rec){
  let s=JSON.stringify(rec),ink=rec.ink||[];
  const thin=p=>{if(p.length<=6)return p;const o=[];for(let i=0;i<p.length;i+=3)if(i%6===0||i===p.length-3)o.push(p[i],p[i+1],p[i+2]);return o;};
  while(s.length>SHEET_MAX&&ink.length){
    const next=ink.map(k=>Object.assign({},k,{p:thin(k.p)}));
    ink=JSON.stringify(next).length<JSON.stringify(ink).length?next:[];
    s=JSON.stringify(Object.assign({},rec,{ink}));
  }
  return s;
}

}
let lastAt=0;
async function pullAll(){
  if(!SHEET){const s=JSON.stringify(load(K.sent,{}));if(s===JSON.stringify(SENT))return false;SENT=JSON.parse(s);return true;}
  try{
    const j=await post({action:"cget",cls:CLASS,pw:PW,since:lastAt});setNet("");
    let changed=false;
    for(const r of j.rows){
      lastAt=Math.max(lastAt,r.at);
      const d=JSON.parse(r.data);d.ink=unpackInk(d.ink);d.at=r.at;
      (ALL[r.name]||(ALL[r.name]={}))[r.id]=d;
      if(r.red!=null&&!(RED[r.name+"|"+r.id]))RED[r.name+"|"+r.id]=unpackInk(JSON.parse(r.red||"[]"));
      changed=true;
    }
    const names=Object.keys(ALL);
    if(names.length&&(!STU||!ALL[STU])){STU=names.sort((a,b)=>Math.max(...Object.values(ALL[b]).map(x=>x.at))-Math.max(...Object.values(ALL[a]).map(x=>x.at)))[0];}
    const sel=$("stu");
    if(names.length&&sel.options.length!==names.length){sel.innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join("");}
    sel.hidden=!names.length;sel.value=STU;
    SENT=ALL[STU]||{};
    return changed;
  }catch(e){setNet(e.message==="pw"?"โหลดไม่ได้: รหัสครูไม่ตรงกับในชีท":"โหลดไม่ได้ ("+e.message+")");return false;}
}

/* ---------- number line ---------- */
const X0=40,X1=960,LY=200;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
function drawLine(svg,L,scale=true){
  svg.innerHTML="";const sx=t=>X0+(t-L.lo)/(L.hi-L.lo)*(X1-X0),den=L.den;
  el("line",{x1:X0-14,y1:LY,x2:X1+14,y2:LY,stroke:"#1f2836","stroke-width":2.5},svg);
  const units=(L.hi-L.lo)/den,every=units<=12?1:units<=24?2:5;
  for(let t=L.lo;t<=L.hi;t++){
    const x=sx(t),whole=t%den===0,maj=whole&&(t/den)%every===0;
    if(!scale&&!maj)continue; // estimate mode: numbers stay, the small ticks to count go
    const h=maj?11:whole?8:5;
    el("line",{x1:x,y1:LY-h,x2:x,y2:LY+h,stroke:maj?"#1f2836":"#8a93a3","stroke-width":maj?2:whole?1.4:1},svg);
    if(maj){const tx=el("text",{x,y:LY+34,"text-anchor":"middle","font-size":t===0?19:16,"font-weight":t===0?700:500,fill:"#1f2836","font-family":"Poppins, sans-serif"},svg);tx.textContent=show(t/den);}
  }
  return sx;
}
function arrow(g,sx,from,to,row,label,faint){
  g.innerHTML="";if(from===to)return;
  const y=30+row*36,x0=sx(from),x1=sx(to),c=to>from?"#4f8a6a":"#c8504a",d=to>from?-12:12,o=faint?0.5:1;
  el("line",{x1:x0,y1:y,x2:x0,y2:LY,stroke:c,"stroke-width":1.5,"stroke-dasharray":"4 4",opacity:o},g);
  el("line",{x1:x0,y1:y,x2:x1,y2:y,stroke:c,"stroke-width":7,"stroke-linecap":"round",opacity:o},g);
  el("polygon",{points:`${x1},${y} ${x1+d},${y-9} ${x1+d},${y+9}`,fill:c,opacity:o},g);
  el("line",{x1,y1:y,x2:x1,y2:LY,stroke:c,"stroke-width":1.5,"stroke-dasharray":"4 4",opacity:o},g);
  if(label){const t=el("text",{x:(x0+x1)/2,y:y-10,"text-anchor":"middle","font-size":16,"font-weight":700,fill:c,"font-family":"Poppins, sans-serif",opacity:o},g);t.textContent=label;}
}
const mvLabel=(f,t,den)=>(t>f?"+":M)+show(Math.abs(t-f),den);
/* a finished picture (for the teacher, the print, and revisits) */
function staticLine(it,s){
  const L=it.line,svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox","0 0 1000 250");svg.setAttribute("class","nl");
  const sx=drawLine(svg,L,it.scale!==false);
  s.arrows.forEach(([f,t],r)=>{const g=el("g",{},svg);arrow(g,sx,f,t,r,mvLabel(f,t,L.den));});
  if(s.pos!=null)el("circle",{cx:sx(s.pos),cy:LY,r:10,fill:"#2b3a55",stroke:"#fff","stroke-width":3},svg);
  return svg;
}
function moveWord(op,b,den){
  const right=(op==="-"?-b:b)>0;
  return `${op==="-"?M:"+"} ${term(b,den)}: ${op==="+"?"plus":"minus"}, ${b<0?"minus":"plus"} → go ${right?"right":"left"} ${show(Math.abs(b),den)}`;
}

function renderStudent(it,stg){

  stg.innerHTML=`<div class="meta"><span class="code">${esc(it.id)}</span><span class="mode ${mc}">${mt}</span><span class="setname">${esc(it.set.name)}</span><span class="status"></span></div>

    <div id="lineBox"></div><div class="fb" id="fb" aria-live="polite"></div><div id="ansArea"></div>`;
  const q=$("q"),ins=$("ins"),fb=$("fb"),lineBox=$("lineBox"),ansArea=$("ansArea");

    if(it.rw)ansArea.insertAdjacentHTML("beforeend",`<div class="rwdone">✓ ${esc(it.rw[0])}</div>`);
    if(s.ok){ansArea.insertAdjacentHTML("beforeend",`<div class="result">${esc(it.q.length>40?"":it.q+" ")}= ${esc(it.ans)}${it.unit?" "+esc(it.unit):""}</div>`);nextBtn(ansArea);return;}
    const row=document.createElement("div");row.className="ansrow";
    row.innerHTML=`<span style="font:700 1.5rem var(--display)">=</span><div class="ansbox${typed?"":" empty"}" id="ab">${esc(typed||"?")}</div>${it.unit?`<span style="font:700 1.4rem var(--display)">${esc(it.unit)}</span>`:""}`;
    const chk=document.createElement("button");chk.className="big";chk.textContent="Check";
    if(it.mode!=="check")row.appendChild(chk); // Check: the answer is kept for the teacher, no right/wrong
    ansArea.appendChild(row);
    const pad=document.createElement("div");pad.id="pad";
    const keys=["1","2","3","4","5","6","7","8","9","0","−",".","/","⌫"].concat(it.alg?["+","x","y","a","b","²","="]:[]);
    for(const k of keys){
      const b=document.createElement("button");b.textContent=k;b.onclick=()=>{
        if(k==="⌫")typed=typed.slice(0,-1);else if(typed.length<16)typed+=k;

      pad.appendChild(b);}

    if(it.mode==="answer"&&L&&!s.shown){
      const r=document.createElement("div");r.className="row";r.style.marginTop="6px";
      const h=document.createElement("button");h.className="ghost";h.textContent="Show the number line";

      r.appendChild(h);ansArea.appendChild(r);
    }
    if(it.mode==="check")nextBtn(ansArea);

      if(same(typed,it.ans)){s.ok=true;say(s.tries.length===1?"Yes! Right first time.":"Yes!",true);}
      else{s.ok=false;typed="";say("Not yet. Try again.",false);}
      persist();renderDots();answerUI();
    };
  }

  /* step 1 on R5 sets: write the question again with every sign showing (the hidden ×, the ÷), then work it out */
  function rewriteUI(){
    ins.textContent=it.rwq||"Write it again with the × put in.";
    let t="";
    const row=document.createElement("div");row.className="ansrow";
    row.innerHTML=`<div class="ansbox rw empty" id="rb">?</div>`;
    const chk=document.createElement("button");chk.className="big";chk.textContent="Check";row.appendChild(chk);
    ansArea.appendChild(row);
    const pad=document.createElement("div");pad.id="pad";
    for(const k of ["1","2","3","4","5","6","7","8","9","0","−","+","×","÷","(",")","[","]","²","³","⌫"]){
      const b=document.createElement("button");b.textContent=k;b.onclick=()=>{
        if(k==="⌫")t=t.slice(0,-1);else if(t.length<30)t+=k;
        const rb=$("rb");rb.textContent=t||"?";rb.classList.toggle("empty",!t);};
      pad.appendChild(b);}
    ansArea.appendChild(pad);
    const norm=x=>String(x).replace(/[−–-]/g,"−").replace(/\s+/g,"");
    chk.onclick=()=>{
      if(!t){say("Type it first.",false);return;}
      s.touched=true;s.rw=(s.rw||[]).concat([t]);
      if(it.rw.some(w=>norm(w)===norm(t))){s.rwOk=true;say("Yes! Now work it out.",true);ins.textContent="Work it out on the right, then type the answer.";}
      else say(it.rwHint||"Not yet. Look at every sign again.",false);
      persist();answerUI();
    };
  }

  const drawQ=()=>{q.innerHTML=qHTML(it,s,needLine);};
  drawQ();
  if(needLine){
    const svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox","0 0 1000 250");svg.setAttribute("class","nl");
    svg.setAttribute("aria-label","Number line: tap to put a dot, drag to draw a move");lineBox.appendChild(svg);
    const sx=drawLine(svg,L,it.scale!==false),den=L.den;
    const arrowsG=el("g",{},svg),ghost=el("g",{},svg);
    const dot=el("circle",{r:10,fill:"#2b3a55",stroke:"#fff","stroke-width":3,cy:LY,visibility:"hidden"},svg);
    const endLab=el("text",{y:LY-20,"text-anchor":"middle","font-size":22,"font-weight":700,fill:"#2b3a55","font-family":"Poppins, sans-serif"},svg);
    const valueAt=ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
      return Math.max(L.lo,Math.min(L.hi,Math.round(L.lo+(p.x-X0)/(X1-X0)*(L.hi-L.lo))));};
    function paint(){
      arrowsG.innerHTML="";
      s.arrows.forEach(([f,t],r)=>{const g=el("g",{},arrowsG);arrow(g,sx,f,t,r,mvLabel(f,t,den));});
      if(s.pos!=null){dot.setAttribute("cx",sx(s.pos));dot.setAttribute("visibility","visible");}
      endLab.textContent=it.mode==="explore"&&done()?show(s.pos,den):"";endLab.setAttribute("x",s.pos==null?0:sx(s.pos));
      if(!s.started)ins.textContent=`Tap the number line to put a dot at ${show(L.a,den)}.`;
      else if(!done()){const [op,b]=L.m[s.k];ins.textContent=`Drag from the dot to show ${op==="-"?M:"+"} ${term(b,den)}.`;}
      else ins.textContent=it.mode==="explore"?"":it.mode==="guess"?"Where did you land? Type the answer.":"Now type the answer.";
      drawQ();
    }
    paint();
    let dragging=false,dragTo=null;
    // iPad Safari can still scroll the page under a drag despite touch-action:none, so block touch scrolling on the line
    svg.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
    svg.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
    svg.addEventListener("pointerdown",ev=>{
      if(done())return;
      if(!s.started){const v=valueAt(ev);s.touched=true;
        if(v===L.a){s.started=true;s.pos=v;say("Good.",true);}else{s.wrongStart++;say(`That is ${show(v,den)}. Find ${show(L.a,den)}.`,false);}
        persist();paint();return;}
      ev.preventDefault();dragging=true;try{svg.setPointerCapture(ev.pointerId)}catch(e){}
      dragTo=valueAt(ev);arrow(ghost,sx,s.pos,dragTo,s.k,mvLabel(s.pos,dragTo,den));
    });
    svg.addEventListener("pointermove",ev=>{if(!dragging)return;const v=valueAt(ev);if(v===dragTo)return;dragTo=v;
      arrow(ghost,sx,s.pos,dragTo,s.k,mvLabel(s.pos,dragTo,den));});
    const endDrag=()=>{
      if(!dragging)return;dragging=false;ghost.innerHTML="";
      if(dragTo===s.pos)return;
      const mv=L.m[s.k],e=s.pos+signed(mv);s.touched=true;
      if(dragTo===e){s.arrows.push([s.pos,e]);s.pos=e;s.k++;say("Yes!",true);
        if(done()&&it.mode==="explore")s.ok=true;}
      else{s.wrongDrag++;const wrongDir=(dragTo>s.pos)!==(e>s.pos);
        say(wrongDir?`Other way. ${moveWord(mv[0],mv[1],den)}`:`Right way. Count again: ${show(Math.abs(mv[1]),den)}.`,false);}
      persist();paint();renderDots();answerUI();
    };
    svg.addEventListener("pointerup",endDrag);
    svg.addEventListener("pointercancel",()=>{dragging=false;ghost.innerHTML="";});
  }else ins.textContent=it.mode==="check"?"Work it out on the paper, then type your answer.":"Work it out on the right, then type the answer.";
  if(s.ok)say("Done.",true);
  answerUI();
}

/* ---------- teacher view of one question ---------- */
function renderTeacher(it,stg){
  const s=SENT[it.id],[mc]=MODES[it.mode];
  if(s){SEEN[(STU||"")+"|"+it.id]=s.at;save(K.seen,SEEN);}
  stg.innerHTML=`<div class="meta"><span class="code">${esc(it.id)}</span><span class="mode ${mc}">${MODES_TH[it.mode]}</span><span class="setname">${esc(it.set.name)}</span>
    <span class="status">${s?"ส่งเมื่อ "+new Date(s.at).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}):"ยังไม่ส่ง"}</span></div>
    <div class="q${it.q.length>40?" long":""}">${esc(it.q)}</div>`;
  // the student may see this screen (screen share), so the answer stays hidden until the teacher taps
  const rv=document.createElement("button");rv.className="ghost reveal";rv.textContent="ดูเฉลย";
  rv.onclick=()=>{rv.outerHTML=`<div class="tans">เฉลย: <b>${esc(it.ans)}${it.unit?" "+esc(it.unit):""}</b></div>`;};
  stg.appendChild(rv);
  if(!s){stg.insertAdjacentHTML("beforeend",`<div class="ins">น้องยังไม่ได้ทำข้อนี้ หรือยังไม่ได้เลื่อนออกจากข้อนี้</div>`);return;}
  if(it.line&&(s.arrows.length||s.shown))stg.appendChild(staticLine(it,s));
  const log=[];
  if(it.rw&&(s.rw||[]).length)log.push(`ขั้นเขียนเครื่องหมาย: ลอง ${s.rw.length} ครั้ง${s.rwOk?" (ผ่าน)":" (ยังไม่ผ่าน)"} · ${s.rw.map(esc).join(" , ")}`);
  if(it.mode!=="check")log.push(`ลอง ${attempts(it,s)} ครั้ง`+(s.tries.length>1?" · "+s.tries.map(esc).join(" , "):""));
  if(s.tries.length)log.push("คำตอบ: <b>"+esc(s.tries[s.tries.length-1])+"</b>");
  else if(it.mode==="check")log.push("ยังไม่ได้ใส่คำตอบ");
  if(s.shown)log.push("เปิดเส้นจำนวนดู");
  log.push(`ใช้เวลา ${s.secs} วินาที`);
  stg.insertAdjacentHTML("beforeend",`<div class="tlog">${log.join("<br>")}</div>`);
}

/* ---------- scratch paper (vector strokes, 0..1 of the paper) ---------- */
const PAPER_W=600,PAPER_H=900;
let penOnly=(()=>{try{return localStorage.getItem("scitem-pen")==="1"}catch(e){return false}})(); // after the first Apple Pencil touch, fingers no longer write
const cMine=$("cMine"),cRed=$("cRed"),xMine=cMine.getContext("2d"),xRed=cRed.getContext("2d");
let erase=false;
function fitPaper(){
  const wrap=$("paperWrap"),p=$("paper");
  const k=Math.min(wrap.clientWidth/PAPER_W,wrap.clientHeight/PAPER_H);
  p.style.width=Math.floor(PAPER_W*k)+"px";p.style.height=Math.floor(PAPER_H*k)+"px";
  const dpr=Math.min(devicePixelRatio||1,3);
  for(const c of [cMine,cRed]){c.width=Math.floor(PAPER_W*k*dpr);c.height=Math.floor(PAPER_H*k*dpr);}
  drawAll();
}
function drawStroke(ctx,c,s){
  const w=c.width,h=c.height,pts=s.p;
  ctx.globalCompositeOperation=s.e?"destination-out":"source-over";
  ctx.strokeStyle=ctx.fillStyle=s.c;ctx.lineCap=ctx.lineJoin="round";
  const base=w/300*(s.e?7:1);
  if(pts.length<4){ctx.beginPath();ctx.arc(pts[0]*w,pts[1]*h,base/1.2,0,7);ctx.fill();return;}
  for(let i=3;i<pts.length;i+=3){
    ctx.lineWidth=s.e?base:base*(0.6+0.9*pts[i+2]);
    ctx.beginPath();ctx.moveTo(pts[i-3]*w,pts[i-2]*h);ctx.lineTo(pts[i]*w,pts[i+1]*h);ctx.stroke();
  }
}
function paintAll(ctx,c,list){ctx.globalCompositeOperation="source-over";ctx.clearRect(0,0,c.width,c.height);for(const s of list)drawStroke(ctx,c,s);}
function mineStrokes(){const id=items[idx].id;return TEACHER?((SENT[id]&&SENT[id].ink)||[]):st(idx).ink;}
function redStrokes(){const k=redKey();return RED[k]||(RED[k]=[]);}
function drawAll(){if(!items.length)return;paintAll(xMine,cMine,mineStrokes());drawRed();}
function drawRed(){if(!items.length)return;const r=RED[redKey()]||[];paintAll(xRed,cRed,r);
  $("redNote").textContent=!TEACHER&&r.length?"Red = your teacher's notes":"";}

/* pen input: the student writes on her layer, the teacher on the red layer */
const target=TEACHER?cRed:cMine;
let curS=null;
function ptOf(e){const r=target.getBoundingClientRect();const q=v=>Math.round(v*1000)/1000;
  return [q((e.clientX-r.left)/r.width),q((e.clientY-r.top)/r.height),e.pointerType==="pen"?q(e.pressure||0.5):0.5];}
target.addEventListener("pointerdown",e=>{
  if(e.pointerType==="pen"&&!penOnly){penOnly=true;try{localStorage.setItem("scitem-pen","1")}catch(err){}}
  if(e.pointerType==="touch"&&penOnly)return;
  if(curS||(TEACHER&&!SENT[items[idx].id]))return;
  e.preventDefault();try{target.setPointerCapture(e.pointerId)}catch(err){}
  curS={id:e.pointerId,s:{c:TEACHER?"#d62828":"#1f2836",e:!TEACHER&&erase,p:ptOf(e)}};
  (TEACHER?redStrokes():mineStrokes()).push(curS.s);
  drawStroke(TEACHER?xRed:xMine,target,curS.s);
});
target.addEventListener("pointermove",e=>{
  if(!curS||e.pointerId!==curS.id)return;e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[],s=curS.s,before=s.p.length;
  for(const ce of (evs.length?evs:[e])){const p=ptOf(ce),n=s.p.length;
    if(Math.abs(p[0]-s.p[n-3])+Math.abs(p[1]-s.p[n-2])<0.002)continue; // keep the Sheet rows small
    s.p.push(...p);}
  if(s.p.length>before)drawStroke(TEACHER?xRed:xMine,target,{c:s.c,e:s.e,p:s.p.slice(Math.max(0,before-3))});
});
function endStroke(e){
  if(!curS||e.pointerId!==curS.id)return;curS=null;
  if(TEACHER)pushRed();else{st(idx).touched=true;persist();}
}
target.addEventListener("pointerup",endStroke);target.addEventListener("pointercancel",endStroke);
// stop iPad Safari turning a pencil stroke into a scroll/selection (see tools/light-p5-shell.html)
$("paper").addEventListener("touchstart",e=>{if([...e.changedTouches].some(t=>t.touchType==="stylus")&&!penOnly){penOnly=true;try{localStorage.setItem("scitem-pen","1")}catch(err){}}e.preventDefault();},{passive:false});
$("paper").addEventListener("touchmove",e=>e.preventDefault(),{passive:false});

$("tPen").onclick=()=>{erase=false;$("tPen").setAttribute("aria-pressed","true");$("tErase").setAttribute("aria-pressed","false");};
$("tErase").onclick=()=>{erase=true;$("tErase").setAttribute("aria-pressed","true");$("tPen").setAttribute("aria-pressed","false");};
$("tUndo").onclick=()=>{const l=TEACHER?redStrokes():mineStrokes();l.pop();if(TEACHER)pushRed();else{st(idx).touched=true;persist();}drawAll();};
$("tClear").onclick=()=>{const l=TEACHER?redStrokes():mineStrokes();if(!l.length||!confirm(TEACHER?"ลบหมึกครูในข้อนี้?":"Clear this page?"))return;l.length=0;if(TEACHER)pushRed();else{st(idx).touched=true;persist();}drawAll();};

/* ---------- Save my work: one printable page of everything done today ---------- */
function paperImage(mine,red){
  const c=document.createElement("canvas");c.width=600;c.height=900;const x=c.getContext("2d");
  const l=document.createElement("canvas");l.width=600;l.height=900;const lx=l.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,600,900);
  for(const list of [mine,red]){lx.clearRect(0,0,600,900);for(const s of list)drawStroke(lx,l,s);x.drawImage(l,0,0);}
  return c.toDataURL("image/png");
}
$("saveBtn").onclick=()=>{
  if(!TEACHER)leave();
  const src=TEACHER?SENT:W,p=$("print");
  const name=TEACHER?STU:(ME.name||"");
  p.innerHTML=`<h1>${esc(C.title)}</h1><div class="sub">${esc(name)} · ${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</div>`;
  for(const it of items){
    const s=src[it.id];if(!s||!s.touched)continue;
    const d=document.createElement("div");d.className="it";
    const done=it.line&&s.started&&s.k>=it.line.m.length;
    const ans=s.tries.length?"Answer: "+esc(s.tries[s.tries.length-1])+(it.unit?" "+esc(it.unit):""):(it.mode==="explore"&&done?"= "+esc(it.ans):"");
    d.innerHTML=`<div><div class="pq">${esc(it.id)} &nbsp; ${esc(it.q)}</div><div class="pa">${ans}</div></div>`;
    if(it.line&&s.arrows.length)d.firstChild.appendChild(staticLine(it,s));
    const red=RED[TEACHER&&SHEET?STU+"|"+it.id:it.id]||[];
    if(s.ink.length||red.length){const img=new Image();img.src=paperImage(s.ink,red);d.appendChild(img);}else d.appendChild(document.createElement("div"));
    p.appendChild(d);
  }
  setTimeout(()=>window.print(),300);
};
})();
</script>
